name: Rust code analysis demo
on:
  push:
    branches: [main]
    paths:
      - 'crates/agentlab_code_analysis/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-code-analysis.yml'
  pull_request:
    paths:
      - 'crates/agentlab_code_analysis/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-code-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust test packaging prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - name: Run the same Rust unit and CLI integration tests used locally
        run: |
          cargo fmt --all --check
          cargo test --locked -p agentlab_code_analysis
      - name: Verify committed parser can be regenerated from pinned grammar tools
        run: |
          mkdir -p "$RUNNER_TEMP/parser-tools"
          cp crates/agentlab_code_analysis/grammar/package.json crates/agentlab_code_analysis/grammar/package-lock.json "$RUNNER_TEMP/parser-tools/"
          npm ci --prefix "$RUNNER_TEMP/parser-tools" --no-audit --no-fund
          cd crates/agentlab_code_analysis/grammar
          NODE_PATH="$RUNNER_TEMP/parser-tools/node_modules" "$RUNNER_TEMP/parser-tools/node_modules/.bin/tree-sitter" generate
          git diff --exit-code -- src
      - name: Read pinned public semantic export for operation replay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d656442d286c8f8646d312ee4d78143985eeda6c
          path: .operation-inputs/knowledge
          persist-credentials: false
      - name: Read pinned public build receipt for operation replay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 993c88e6d4a68559ee161543a9a618074c49229a
          path: .operation-inputs/receipts
          persist-credentials: false
      - name: Qualify strict operation transition and unchanged replay
        run: |
          bash scripts/run-maintainer-operation-receipt-smoke.sh \
            .operation-inputs/knowledge/examples/maintainer-knowledge-gate/first-four/maintainer_scope_skills.jsonl \
            .operation-inputs/knowledge/examples/maintainer-knowledge-gate/first-four/program_facts.jsonl \
            .operation-inputs/receipts \
            release/qualifications/code-workshop-7aa95cac-componentlibrary-build/build-qualification.json \
            de1f82800dd7680242948d77d6c2416c5d97319f72d2d876cbca194a82ddeba7 \
            skill-scope-code-workshop-componentlibrary-framework \
            "$RUNNER_TEMP/operation-round-evidence"
      - name: Preserve operation round and replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintainer-operation-round-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/operation-round-evidence/
  pinned-harmony-syntax-coverage:
    needs: rust-local-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch exact public code-workshop source
        run: |
          git clone --no-checkout --depth 1 https://gitcode.com/HarmonyOS_Samples/sample_in_harmonyos.git "$RUNNER_TEMP/harmony-source"
          git -C "$RUNNER_TEMP/harmony-source" fetch --depth 1 origin 7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6
          git -C "$RUNNER_TEMP/harmony-source" checkout --detach FETCH_HEAD
      - name: Run the released-source Rust analyzer directly without Python
        run: |
          cargo run --locked -p agentlab_code_analysis -- "$RUNNER_TEMP/harmony-source" "$RUNNER_TEMP/ast-evidence"
          printf 'Rust syntax coverage completed; inspect analysis.json for unresolved grammar gaps. This is not HAP or subject-Agent acceptance.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete syntax facts and coverage including parse errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-harmony-ast-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/ast-evidence/

name: Maintainer Skill Agent flywheel
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository selection; auto balances normalized semantic coverage
        required: true
        type: choice
        options: [auto, code-workshop, guide-snippets, harmony-iap-client, hms-cordova-iap]
        default: auto
      iterations:
        description: Bounded hard-gated iterations committed atomically to TableGit
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '1'
      model:
        description: Model exposed by the LM Gateway
        required: true
        default: glm-5.3-flash
        type: string
      provider_route:
        description: Explicit LM Gateway provider route
        required: true
        default: glm
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maintainer-skill-agent-flywheel
  cancel-in-progress: false

jobs:
  propose-and-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AGENTLAB_ROOT: /tmp/maintainer-skill-agent-flywheel
      KNOWLEDGE: examples/maintainer-knowledge-gate/first-four
      REPOSITORY_SELECTOR: ${{ inputs.repository }}
      ITERATIONS: ${{ inputs.iterations }}
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
      AGENTLAB_MODEL: ${{ inputs.model }}
      AGENTLAB_PROVIDER_ROUTE: ${{ inputs.provider_route }}
      AGENTLAB_TABLEGIT_MCP_URL: ${{ vars.AGENTLAB_TABLEGIT_MCP_URL }}
      AGENTLAB_TABLEGIT_PERSON_ID: ${{ vars.AGENTLAB_TABLEGIT_PERSON_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate orchestration and build the Rust hard gate
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_maintainer_skill_agent_flywheel \
            tests.test_maintainer_skill_tablegit \
            tests.test_case_generation_shadow
          cargo build --locked -p agentlab_code_analysis --bin agentlab-maintainer-skill-flywheel
      - name: Install the separately contained Pi runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pi-runtime"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/pi-runtime/"
          npm ci --prefix "$RUNNER_TEMP/pi-runtime"
          "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi" --version
      - name: Run the bounded hard-gated Maintainer Skill loop
        id: loop
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          scripts/run-maintainer-skill-agent-loop.sh \
            "$KNOWLEDGE" "$AGENTLAB_ROOT/run" "$REPOSITORY_SELECTOR" "$ITERATIONS" \
            "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi"
      - name: Persist in TableGit and export the exact committed revision
        run: |
          set -euo pipefail
          test -n "$AGENTLAB_TABLEGIT_MCP_URL"
          test -n "$AGENTLAB_TABLEGIT_PERSON_ID"
          python3 scripts/maintainer-skill-tablegit.py sync \
            --base "$KNOWLEDGE" --snapshot '${{ steps.loop.outputs.snapshot }}' \
            --export "$KNOWLEDGE" --receipt "$AGENTLAB_ROOT/run/tablegit-sync-receipt.json" \
            --run-id "$GITHUB_RUN_ID" --github-repository "$GITHUB_REPOSITORY"
          jq '{repo,revision,authorityVerified,mirror,tables}' \
            "$AGENTLAB_ROOT/run/tablegit-sync-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Sample one non-promoted shadow case from the knowledge gain
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          scripts/run-case-generation-shadow.sh \
            "$KNOWLEDGE" "$AGENTLAB_ROOT/run" \
            "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi"
      - name: Propose the fixed-revision Release export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/maintainer-skill-flywheel-$GITHUB_RUN_ID"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add "$KNOWLEDGE"
          git diff --cached --exit-code && {
            echo "The exact TableGit export already matches Release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          git commit -m "export maintainer skill flywheel $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          url=$(gh pr create \
            --base main --head "$branch" \
            --title "Export Maintainer Skill flywheel $GITHUB_RUN_ID" \
            --body "Exports $ITERATIONS hard-gated Maintainer Skill iteration(s) from the exact committed TableGit revision recorded in maintainer-knowledge-cut.json. Every iteration advanced exactly one scope to L2. The downstream shadow generation round sampled at most one non-promoted case hypothesis and retained failure feedback when construction was rejected; automatic promotion remains disabled. Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "Release export PR: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the proposal, gateway capture and hard-gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintainer-skill-agent-flywheel-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ env.AGENTLAB_ROOT }}/run/

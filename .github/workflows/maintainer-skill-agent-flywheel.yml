name: Maintainer Skill Agent flywheel
run-name: ${{ inputs.coordinator_request_id && format('AgentLab gap {0}', inputs.coordinator_request_id) || 'Maintainer Skill Agent flywheel' }}
on:
  workflow_dispatch:
    inputs:
      coordinator_request_id:
        description: Optional original gap-dispatch identity for read-only run recovery
        required: false
        default: ''
        type: string
      expected_method:
        description: Optional exact Release commit required by the gap coordinator
        required: false
        default: ''
        type: string
      mode:
        description: Expand, refresh, or atomically apply reviewed scope replacements
        required: true
        type: choice
        options: [expand, focused-refresh, scope-rewrite]
        default: expand
      repository:
        description: Repository selection; auto balances normalized semantic coverage
        required: true
        type: string
        default: code-workshop
      knowledge_directory:
        description: Exact checked-in committed knowledge cut; live revision admission remains mandatory
        required: true
        default: examples/maintainer-knowledge-gate/first-four
        type: string
      iterations:
        description: Bounded hard-gated batches committed atomically to TableGit
        required: true
        type: choice
        options: ['1', '2', '3']
        default: '1'
      scope_batch_size:
        description: Independently validated scopes analyzed in parallel per batch
        required: true
        type: choice
        options: ['1', '2', '3', '4']
        default: '3'
      candidate_id:
        description: Existing shadow candidate for focused-refresh mode
        required: false
        default: shadow-case-uiability-backup-restore-state-recovery
        type: string
      construction_plan:
        description: Repository-relative readiness plan for focused-refresh mode
        required: false
        default: examples/maintainer-knowledge-gate/first-four/construction-plans/uiability-backup-restore.json
        type: string
      model:
        description: Model exposed by the LM Gateway
        required: true
        default: glm-5.3-flash
        type: string
      provider_route:
        description: Explicit LM Gateway provider route
        required: true
        default: glm
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maintainer-skill-agent-flywheel
  cancel-in-progress: false

jobs:
  propose-and-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AGENTLAB_ROOT: /tmp/maintainer-skill-agent-flywheel
      KNOWLEDGE: ${{ inputs.knowledge_directory }}
      REPOSITORY_SELECTOR: ${{ inputs.repository }}
      ITERATIONS: ${{ inputs.iterations }}
      AGENTLAB_SCOPE_BATCH_SIZE: ${{ inputs.scope_batch_size }}
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
      AGENTLAB_MODEL: ${{ inputs.model }}
      AGENTLAB_PROVIDER_ROUTE: ${{ inputs.provider_route }}
      FOCUSED_CANDIDATE_ID: ${{ inputs.candidate_id }}
      FOCUSED_CONSTRUCTION_PLAN: ${{ inputs.construction_plan }}
      AGENTLAB_TABLEGIT_MCP_URL: ${{ vars.AGENTLAB_TABLEGIT_MCP_URL }}
      AGENTLAB_TABLEGIT_PERSON_ID: ${{ vars.AGENTLAB_TABLEGIT_PERSON_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fence coordinator method before execution
        env:
          EXPECTED_METHOD: ${{ inputs.expected_method }}
        run: |
          if test -n "$EXPECTED_METHOD"; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_METHOD"
          fi
      - name: Validate explicit knowledge directory before authority admission
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          selected=os.environ['KNOWLEDGE']
          assert selected and not selected.startswith('/') and chr(92) not in selected
          assert all(p not in ('','.','..') for p in selected.split('/'))
          root=Path.cwd().resolve();cut=Path(selected)
          assert cut.is_dir() and not cut.is_symlink() and cut.resolve().is_relative_to(root)
          manifest=cut/'maintainer-knowledge-cut.json'
          assert manifest.is_file() and not manifest.is_symlink() and manifest.resolve().is_relative_to(root)
          PY
      - name: Admit only an exact current TableGit input before Agent execution
        run: |
          set -euo pipefail
          python3 scripts/maintainer-skill-tablegit.py preflight \
            --base "$KNOWLEDGE" \
            --receipt "$AGENTLAB_ROOT/run/tablegit-preflight-receipt.json"
      - name: Validate orchestration and build the Rust hard gate
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.test_maintainer_skill_agent_flywheel \
            tests.test_maintainer_skill_tablegit \
            tests.test_apply_scope_decomposition_review \
            tests.test_maintainer_scope_decomposition_review \
            tests.test_case_generation_shadow \
            tests.test_shadow_construction_readiness \
            tests.test_focused_fact_refresh
          cargo build --locked -p agentlab_code_analysis --bin agentlab-maintainer-skill-flywheel
      - name: Install the separately contained Pi runtime
        if: inputs.mode != 'scope-rewrite'
        run: |
          mkdir -p "$RUNNER_TEMP/pi-runtime"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/pi-runtime/"
          npm ci --prefix "$RUNNER_TEMP/pi-runtime"
          "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi" --version
      - name: Run the bounded hard-gated Maintainer Skill loop
        id: loop
        if: inputs.mode == 'expand'
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          scripts/run-maintainer-skill-agent-loop.sh \
            "$KNOWLEDGE" "$AGENTLAB_ROOT/run" "$REPOSITORY_SELECTOR" "$ITERATIONS" \
            "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi"
      - name: Run the candidate-feedback focused refresh
        id: focused
        if: inputs.mode == 'focused-refresh'
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          scripts/run-maintainer-skill-focused-refresh.sh \
            "$KNOWLEDGE" "$AGENTLAB_ROOT/run" \
            "$FOCUSED_CANDIDATE_ID" "$FOCUSED_CONSTRUCTION_PLAN" \
            "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi"
      - name: Stage the reviewed scope catalog rewrite
        id: rewrite
        if: inputs.mode == 'scope-rewrite'
        run: |
          set -euo pipefail
          scripts/run-maintainer-scope-catalog-rewrite.sh \
            "$KNOWLEDGE" "$AGENTLAB_ROOT/scope-rewrite"
      - name: Persist in TableGit and export the exact committed revision
        run: |
          set -euo pipefail
          test -n "$AGENTLAB_TABLEGIT_MCP_URL"
          test -n "$AGENTLAB_TABLEGIT_PERSON_ID"
          python3 scripts/maintainer-skill-tablegit.py sync \
            --base "$KNOWLEDGE" --snapshot '${{ steps.loop.outputs.snapshot || steps.focused.outputs.snapshot || steps.rewrite.outputs.snapshot }}' \
            --export "$AGENTLAB_ROOT/committed-knowledge" --receipt "$AGENTLAB_ROOT/run/tablegit-sync-receipt.json" \
            --run-id "$GITHUB_RUN_ID" --github-repository "$GITHUB_REPOSITORY"
          jq '{repo,revision,authorityVerified,mirror,tables}' \
            "$AGENTLAB_ROOT/run/tablegit-sync-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish successor cut without overwriting immutable input
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          workspace=Path.cwd().resolve();root=Path(os.environ['AGENTLAB_ROOT'])
          source=root/'committed-knowledge'
          receipt=json.loads((root/'run/tablegit-sync-receipt.json').read_bytes())
          manifest=json.loads((source/'maintainer-knowledge-cut.json').read_bytes())
          revision=receipt['revision'];assert re.fullmatch('[0-9a-f]{40}',revision)
          assert receipt['authorityVerified'] is True and manifest['tableGitAuthority']['revision']==revision
          publication=workspace/'examples/maintainer-knowledge-gate/cuts'
          assert not publication.is_symlink() and publication.resolve().is_relative_to(workspace)
          publication.mkdir(parents=True,exist_ok=True)
          def inventory(directory):
              assert directory.is_dir() and not directory.is_symlink()
              entries=list(directory.rglob('*'));assert all(not p.is_symlink() and (p.is_file() or p.is_dir()) for p in entries)
              return {str(p.relative_to(directory)):hashlib.sha256(p.read_bytes()).hexdigest() for p in entries if p.is_file()}
          original=inventory(source);destination=publication/revision
          if destination.exists():
              assert inventory(destination)==original,'Existing immutable revision differs; retain committed export and stop'
          else:shutil.copytree(source,destination)
          assert inventory(source)==original and inventory(destination)==original
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:stream.write('KNOWLEDGE='+str(destination.relative_to(workspace))+'\n')
          print(json.dumps(dict(revision=revision,inputCutPreserved=True,publication=str(destination.relative_to(workspace)),authorityWritePerformed=False)))
          PY
      - name: Derive a focused successor without rewriting the parent candidate
        if: inputs.mode == 'focused-refresh'
        run: |
          set -euo pipefail
          python3 examples/maintainer-knowledge-gate/focused_fact_refresh.py rebind-candidate \
            --knowledge "$KNOWLEDGE" --candidate-id "$FOCUSED_CANDIDATE_ID" \
            --plan "$FOCUSED_CONSTRUCTION_PLAN" \
            --focused-receipt "$AGENTLAB_ROOT/run/focused-refresh/proposal-receipt.json" \
            --evidence-root . \
            --output "$AGENTLAB_ROOT/run/focused-refresh/candidate-rebind-receipt.json"
          jq '{candidateId,parentCandidateId,parentPreserved,parentPlanPreserved,successorPlan,readinessDecision,nextGate,addedEditablePaths,addedContextPaths}' \
            "$AGENTLAB_ROOT/run/focused-refresh/candidate-rebind-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Sample one non-promoted shadow case from the knowledge gain
        if: inputs.mode == 'expand'
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          set -euo pipefail
          if ! scripts/run-case-generation-shadow.sh \
              "$KNOWLEDGE" "$AGENTLAB_ROOT/run" \
              "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi"; then
            echo "::warning::Shadow case sampling failed after the knowledge transaction; preserving the exact TableGit export."
            echo "Shadow case sampling failed and did not block the first two Maintainer Skill flywheels." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Route downstream gaps without another semantic expansion
        run: |
          set -euo pipefail
          bash scripts/plan-maintainer-downstream.sh \
            "$KNOWLEDGE" . "$AGENTLAB_ROOT/run/downstream"
          jq '.' "$AGENTLAB_ROOT/run/downstream/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Propose the fixed-revision Release export
        # Downstream routing artifacts are separate from the TableGit snapshot.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/maintainer-skill-flywheel-$GITHUB_RUN_ID"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add "$KNOWLEDGE"
          git diff --cached --exit-code && {
            echo "The exact TableGit export already matches Release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          git commit -m "export maintainer skill flywheel $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          url=$(gh pr create \
            --base main --head "$branch" \
            --title "Export Maintainer Skill flywheel $GITHUB_RUN_ID" \
            --body "Exports the ${{ inputs.mode }} Maintainer Skill transaction from the exact committed TableGit revision recorded in maintainer-knowledge-cut.json. Expand mode advances one bounded L1 scope per iteration; focused-refresh mode updates one existing fact from an exact candidate readiness blocker without changing maturity counts. Automatic promotion remains disabled. Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "Release export PR: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove transient source checkout links from retained evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "$AGENTLAB_ROOT/run" ]]; then
            find "$AGENTLAB_ROOT/run" -path '*/workspace/source' -type l -delete
          fi
      - name: Preserve the proposal, gateway capture and hard-gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintainer-skill-agent-flywheel-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ env.AGENTLAB_ROOT }}/run/

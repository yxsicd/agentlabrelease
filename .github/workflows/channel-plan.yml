name: Freeze channel validation plan
on:
  workflow_dispatch:
    inputs:
      target:
        description: Channel to validate; planning does not activate it
        type: choice
        options: [aldev, almain, alprod]
        default: aldev
      candidate:
        description: Candidate directory name for aldev only
        type: string
        default: 40ecdf4b-linux-x64
permissions:
  contents: read
jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select and freeze the upstream reference cut
        env:
          TARGET: ${{ inputs.target }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          mkdir -p "$RUNNER_TEMP/channel-source"
          python3 - <<'PY'
          import os, pathlib, shutil, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'channel-source'
          target=os.environ['TARGET']
          if target=='aldev':
              name=os.environ['CANDIDATE']
              assert pathlib.Path(name).name==name
              source=pathlib.Path('release/candidates')/name
              for f in ['environment-lock.json','publication.json']:shutil.copyfile(source/f,root/f)
          else:
              parent={'almain':'aldev','alprod':'almain'}[target]
              base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+parent+'/'
              for f in ['environment-lock.json','publication.json']:
                  (root/f).write_bytes(urllib.request.urlopen(base+'agentlab-'+parent+'-'+f,timeout=30).read())
          PY
          python3 scripts/channel-plan.py --target "$TARGET" \
            --publication "$RUNNER_TEMP/channel-source/publication.json" \
            --lock "$RUNNER_TEMP/channel-source/environment-lock.json" \
            --output "$RUNNER_TEMP/channel-source/plan.json"
      - name: Retain the frozen plan and original source metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-validation-plan
          path: ${{ runner.temp }}/channel-source/
          if-no-files-found: error
  validate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: channel-validation-plan
          path: ${{ runner.temp }}/channel-source
      - name: Install demo prerequisites on the fresh runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd btrfs-progs python3-websocket python3-yaml
      - name: Execute the frozen composition and collect target-bound verdicts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/channel-validate.py --source "$RUNNER_TEMP/channel-source" --root /tmp/agentlab-channel-validation
      - name: Preserve actual results and failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channel-validation-evidence
          if-no-files-found: error
          path: |
            /tmp/agentlab-channel-validation/*.json
            /tmp/agentlab-channel-validation/*.log
            /tmp/agentlab-channel-validation/runs/
            /tmp/agentlab-channel-validation/mock-evidence/
            /tmp/agentlab-channel-validation/protocol/evidence/
            /tmp/agentlab-channel-validation/tablegit-demo/evidence-*/
            /tmp/agentlab-channel-validation/tablegit-repeat/evidence-*/
            /tmp/agentlab-channel-validation/harmony-build-demo/evidence/

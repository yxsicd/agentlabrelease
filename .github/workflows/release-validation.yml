name: Public release validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: public-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release manifests and tests
        run: |
          python3 scripts/validate-release.py
          python3 -m unittest discover -s tests
          python3 scripts/validate-composition-release.py
      - name: Test and build public tools
        run: |
          cargo test --locked --workspace
          cargo build --locked --release --workspace
  public-install-deploy-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install archive support
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - name: Install fixed composition and run the public basic use case
        env:
          AGENTLAB_RELEASE_CHANNEL: alprod
          AGENTLAB_RELEASE_REPO: yxsicd/agentlabrelease
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-public-install-deploy-smoke.sh

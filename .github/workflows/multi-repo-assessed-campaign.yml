name: Multi-repository assessed-Agent campaign
on:
  workflow_dispatch:
    inputs:
      case_run_id:
        description: Successful trusted-main case-review run to assess
        required: true
        type: string
      authenticated_review_run_id:
        description: Optional successful attested blind-review adjudication run
        required: false
        type: string
      participant_profiles_json:
        description: JSON array of 3-8 unique participantId/model objects ordered weakest to strongest before any outcomes exist
        required: true
        type: string
      provider_route:
        description: Explicit LM Gateway provider route
        required: true
        default: glm
        type: string
      trials:
        description: Independent fresh trials per model
        type: choice
        options: ['3', '5', '10', '20']
        default: '5'

permissions:
  contents: read
  actions: read
  artifact-metadata: write
  attestations: write
  id-token: write

concurrency:
  group: multi-repo-assessed-campaign
  cancel-in-progress: false

jobs:
  freeze-plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENTLAB_PLAN_GATE: ${{ github.workspace }}/.agentlab-work/participant-plan-gate
      PARTICIPANT_PROFILES_JSON: ${{ inputs.participant_profiles_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Recover the exact trusted case for the plan gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.case_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$AGENTLAB_PLAN_GATE/case"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$AGENTLAB_PLAN_GATE/source-run.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ["AGENTLAB_PLAN_GATE"] + "/source-run.json"))
          assert value["head_branch"] == "main"
          assert value["path"] == ".github/workflows/multi-repo-case-review.yml"
          assert value["conclusion"] == "success"
          PY
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name multi-repo-frozen-case --dir "$AGENTLAB_PLAN_GATE/case"
      - name: Freeze participant-visible manifest before assessment
        run: |
          python3 scripts/build-blind-case-cut.py validate \
            --cut "$AGENTLAB_PLAN_GATE/case/blind-cut"
          python3 scripts/build-blind-case-cut.py stage-participant \
            --cut "$AGENTLAB_PLAN_GATE/case/blind-cut" \
            --output "$RUNNER_TEMP/agentlab-plan-gate-participant" \
            --receipt "$AGENTLAB_PLAN_GATE/blind-dispatch-receipt.json"
      - name: Build and preserve the exact portable participant image
        run: |
          set -euo pipefail
          participant_tag="agentlab-pi-participant:${GITHUB_SHA}"
          AGENTLAB_PARTICIPANT_CACHE_TAR="$AGENTLAB_PLAN_GATE/participant-runtime-image.tar" \
            examples/knowledge-seed/subject/participant-runtime.sh \
              "$AGENTLAB_PLAN_GATE/participant-container" "$participant_tag"
          image_id=$(<"$AGENTLAB_PLAN_GATE/participant-container/image.txt")
          printf '%s\n' "$image_id" > "$AGENTLAB_PLAN_GATE/runtime-image-id.txt"
      - name: Freeze the portable participant dispatch in Rust
        run: |
          set -euo pipefail
          cargo run --locked --release -p agentlab_code_analysis \
            --bin agentlab-participant-experiment-dispatch -- freeze \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --case "$AGENTLAB_PLAN_GATE/case/evaluation-case.json" \
            --case-review-run-id "${{ inputs.case_run_id }}" \
            --method-revision "$GITHUB_SHA" \
            --profiles-json "$PARTICIPANT_PROFILES_JSON" \
            --provider-route "${{ inputs.provider_route }}" \
            --trials "${{ inputs.trials }}" \
            --participant-adapter examples/multi-repo-case/pi-assessed-agent.py \
            --participant-driver examples/real-code-agent/participant.py \
            --participant-package-lock examples/real-code-agent/participant/package-lock.json \
            --participant-manifest "$RUNNER_TEMP/agentlab-plan-gate-participant/manifest.json" \
            --runtime-dockerfile examples/knowledge-seed/subject/participant.Dockerfile \
            --runtime-build-script examples/knowledge-seed/subject/participant-runtime.sh \
            --runtime-image-id "$(<"$AGENTLAB_PLAN_GATE/runtime-image-id.txt")" \
            --runtime-image-archive "$AGENTLAB_PLAN_GATE/participant-runtime-image.tar" \
            --output "$AGENTLAB_PLAN_GATE/participant-experiment-dispatch.json"
          sha256sum "$AGENTLAB_PLAN_GATE/participant-experiment-dispatch.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the pre-execution participant dispatch
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.AGENTLAB_PLAN_GATE }}/participant-experiment-dispatch.json
      - name: Preserve the gated plan and exact participant image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: participant-plan-gate
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
          path: |
            ${{ env.AGENTLAB_PLAN_GATE }}/participant-experiment-dispatch.json
            ${{ env.AGENTLAB_PLAN_GATE }}/participant-runtime-image.tar
            ${{ env.AGENTLAB_PLAN_GATE }}/runtime-image-id.txt
            ${{ env.AGENTLAB_PLAN_GATE }}/participant-container/participant-image.json
            ${{ env.AGENTLAB_PLAN_GATE }}/participant-container/participant-runtime-preflight.txt

  assess:
    needs: freeze-plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AGENTLAB_ROOT: ${{ github.workspace }}/.agentlab-work/multi-repo-assessed-campaign
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify and recover the trusted frozen case
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.case_run_id }}
        run: |
          mkdir -p "$AGENTLAB_ROOT"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$AGENTLAB_ROOT/source-run.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ["AGENTLAB_ROOT"] + "/source-run.json"))
          assert value["head_branch"] == "main"
          assert value["path"] == ".github/workflows/multi-repo-case-review.yml"
          assert value["conclusion"] == "success"
          PY
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name multi-repo-frozen-case --dir "$AGENTLAB_ROOT/case"
      - name: Reconstruct the exact reviewed source repositories
        run: |
          python3 scripts/prepare-multi-repo-analysis-sources.py \
            --spec "$AGENTLAB_ROOT/case/source/cohort/source/analysis-source/source-spec.json" \
            --output "$AGENTLAB_ROOT/input"
      - name: Stage only the participant-visible blind input
        run: |
          python3 scripts/build-blind-case-cut.py validate \
            --cut "$AGENTLAB_ROOT/case/blind-cut"
          python3 scripts/build-blind-case-cut.py stage-participant \
            --cut "$AGENTLAB_ROOT/case/blind-cut" \
            --output "$RUNNER_TEMP/agentlab-blind-participant" \
            --receipt "$AGENTLAB_ROOT/blind-dispatch-receipt.json"
          python3 scripts/build-blind-case-cut.py validate-dispatch \
            --participant-root "$RUNNER_TEMP/agentlab-blind-participant" \
            --receipt "$AGENTLAB_ROOT/blind-dispatch-receipt.json"
      - name: Recover and independently verify authenticated review adjudication
        if: inputs.authenticated_review_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ inputs.authenticated_review_run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEW_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$REVIEW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name blind-case-authenticated-adjudication \
            --dir "$AGENTLAB_ROOT/authenticated-review"
          python3 scripts/authenticate-blind-case-review.py verify-online \
            --bundle "$AGENTLAB_ROOT/authenticated-review" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$REVIEW_RUN_ID" \
            --verification-output "$AGENTLAB_ROOT/authenticated-review-final-attestation-verification.json" \
            | tee "$AGENTLAB_ROOT/authenticated-review-validation.json"
      - name: Download the separately frozen participant plan gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: participant-plan-gate
          path: ${{ runner.temp }}/participant-plan-gate
      - name: Verify the dispatch attestation before runtime materialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/participant-plan-gate/participant-experiment-dispatch.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/multi-repo-assessed-campaign.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json > "$AGENTLAB_ROOT/participant-dispatch-attestation-verification.json"
          cp "$RUNNER_TEMP/participant-plan-gate/participant-experiment-dispatch.json" \
            "$AGENTLAB_ROOT/participant-experiment-dispatch.json"
      - name: Install a separately contained Pi runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pi-runtime"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/pi-runtime/"
          npm ci --prefix "$RUNNER_TEMP/pi-runtime"
          "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi" --version
      - name: Freeze the least-mounted participant container runtime
        run: |
          participant_tag="agentlab-pi-participant:${GITHUB_SHA}"
          AGENTLAB_PARTICIPANT_CACHE_TAR="$RUNNER_TEMP/participant-plan-gate/participant-runtime-image.tar" \
            examples/knowledge-seed/subject/participant-runtime.sh \
              "$AGENTLAB_ROOT/participant-container" "$participant_tag"
          python3 scripts/prepare-participant-runtime.py \
            --image "$participant_tag" \
            --pi-runtime "$RUNNER_TEMP/pi-runtime" \
            --case-input "$RUNNER_TEMP/agentlab-blind-participant" \
            --forbid "$AGENTLAB_ROOT/case" \
            --forbid "$AGENTLAB_ROOT/blind-dispatch-receipt.json" \
            --output "$AGENTLAB_ROOT/participant-runtime.json"
      - name: Materialize the attested portable dispatch into the local execution plan
        run: |
          set -euo pipefail
          cargo run --locked --release -p agentlab_code_analysis \
            --bin agentlab-participant-experiment-dispatch -- materialize \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --method-revision "$GITHUB_SHA" \
            --dispatch "$AGENTLAB_ROOT/participant-experiment-dispatch.json" \
            --attestation-verification "$AGENTLAB_ROOT/participant-dispatch-attestation-verification.json" \
            --case "$AGENTLAB_ROOT/case/evaluation-case.json" \
            --runtime-image-archive "$RUNNER_TEMP/participant-plan-gate/participant-runtime-image.tar" \
            --runtime-config "$AGENTLAB_ROOT/participant-runtime.json" \
            --output "$AGENTLAB_ROOT/participant-experiment-plan.json" \
            --verification-output "$AGENTLAB_ROOT/participant-dispatch-materialization.json"
          python3 scripts/participant-experiment-plan.py validate \
            --plan "$AGENTLAB_ROOT/participant-experiment-plan.json" \
            --case "$AGENTLAB_ROOT/case/evaluation-case.json"
          AGENTLAB_PROVIDER_ROUTE=$(jq -r .providerRoute "$AGENTLAB_ROOT/participant-experiment-plan.json")
          TRIALS=$(jq -r .trialsPerParticipant "$AGENTLAB_ROOT/participant-experiment-plan.json")
          printf 'AGENTLAB_PROVIDER_ROUTE=%s\nTRIALS=%s\n' \
            "$AGENTLAB_PROVIDER_ROUTE" "$TRIALS" >> "$GITHUB_ENV"
          sha256sum "$AGENTLAB_ROOT/participant-experiment-plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the pre-outcome participant experiment plan
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.AGENTLAB_ROOT }}/participant-experiment-plan.json
      - name: Run fresh staged attempts for every predeclared capability tier
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          GH_TOKEN: ${{ github.token }}
          AGENTLAB_PI_BINARY: ${{ github.workspace }}/scripts/run-pi-in-docker.py
        run: |
          set -euo pipefail
          mkdir -p "$AGENTLAB_ROOT/runs"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["AGENTLAB_ROOT"])
          plan = json.loads((root / "participant-experiment-plan.json").read_text())
          root.joinpath("participant-arms.tsv").write_text(
              "".join(
                  f"tier-{row['ordinal']:02d}\t{row['participantId']}\t{row['model']}\n"
                  for row in plan["participantProfiles"]
              ),
              encoding="utf-8",
          )
          PY
          review_args=()
          dependency_args=()
          if python3 - <<'PY'
          import json, os
          case = json.load(open(os.environ["AGENTLAB_ROOT"] + "/case/evaluation-case.json"))
          raise SystemExit(0 if case.get("dependencyDiscovery") is not None else 1)
          PY
          then
            test -f "$AGENTLAB_ROOT/case/blind-cut/evaluator/dependency-discovery-contract.json"
            test -f "$AGENTLAB_ROOT/case/blind-cut/evaluator/program-facts.jsonl"
            dependency_args=(
              --dependency-contract "$AGENTLAB_ROOT/case/blind-cut/evaluator/dependency-discovery-contract.json"
              --program-facts "$AGENTLAB_ROOT/case/blind-cut/evaluator/program-facts.jsonl"
            )
          fi
          if [[ -n "${{ inputs.authenticated_review_run_id }}" ]]; then
            review_args=(
              --authenticated-review-bundle "$AGENTLAB_ROOT/authenticated-review"
              --authenticated-review-repository "$GITHUB_REPOSITORY"
              --authenticated-review-run-id "${{ inputs.authenticated_review_run_id }}"
            )
          fi
          while IFS=$'\t' read -r arm participant_id model; do
            for trial in $(seq 1 "$TRIALS"); do
              export AGENTLAB_MODEL="$model"
              output="$AGENTLAB_ROOT/runs/${arm}-${trial}"
              set +e
              python3 scripts/run-multi-repo-assessment.py \
                --case "$AGENTLAB_ROOT/case/evaluation-case.json" \
                --manifest "$AGENTLAB_ROOT/input/manifest.json" \
                --oracle "$AGENTLAB_ROOT/case/blind-cut/evaluator/oracle.mjs" \
                --participant examples/multi-repo-case/pi-assessed-agent.py \
                --blind-participant-root "$RUNNER_TEMP/agentlab-blind-participant" \
                --blind-dispatch-receipt "$AGENTLAB_ROOT/blind-dispatch-receipt.json" \
                --participant-runtime-config "$AGENTLAB_ROOT/participant-runtime.json" \
                --experiment-plan "$AGENTLAB_ROOT/participant-experiment-plan.json" \
                "${dependency_args[@]}" \
                "${review_args[@]}" \
                --participant-id "$participant_id" --output "$output"
              status=$?
              set -e
              [[ -f "$output/summary.json" && -f "$output/decision-package.json" ]]
              printf '%s\n' "$status" > "$output/runner-exit-code.txt"
            done
          done < "$AGENTLAB_ROOT/participant-arms.tsv"
      - name: Collect attempts and score repeatable model separation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["AGENTLAB_ROOT"])
          case = json.loads((root / "case/evaluation-case.json").read_text())
          plan = json.loads((root / "participant-experiment-plan.json").read_text())
          attempts = []
          for profile in plan["participantProfiles"]:
              arm = f"tier-{profile['ordinal']:02d}"
              for trial in range(1, plan["trialsPerParticipant"] + 1):
                  attempts.append({"attemptId": f"{arm}-{trial}", "participantId": profile["participantId"],
                                   "producerRun": os.environ["GITHUB_RUN_ID"],
                                   "evidence": f"runs/{arm}-{trial}"})
          manifest = {"schema": "agentlab.case_attempt_collection.v2",
                      "sourceSetSha256": case["sourceSetSha256"],
                      "methodRevision": os.environ["GITHUB_SHA"],
                      "cases": [{"id": case["id"],
                                 "calibration": "case/calibration/summary.json",
                                 "attempts": attempts}]}
          (root / "attempts.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          python3 scripts/collect-case-attempts.py \
            --manifest "$AGENTLAB_ROOT/attempts.json" \
            --output "$AGENTLAB_ROOT/discrimination-input.json"
          python3 scripts/score-case-discrimination.py \
            --input "$AGENTLAB_ROOT/discrimination-input.json" \
            --required-trials "$TRIALS" \
            --output "$AGENTLAB_ROOT/case-discrimination-report.json"
          cat "$AGENTLAB_ROOT/case-discrimination-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign the exact discrimination report with GitHub OIDC provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.AGENTLAB_ROOT }}/case-discrimination-report.json
      - name: Derive review-required difficulty feedback for the next maintenance cut
        run: |
          cp "$AGENTLAB_ROOT/discrimination-input.json" \
            "$AGENTLAB_ROOT/case-discrimination-input.json"
          cp "$AGENTLAB_ROOT/case/evaluation-case.json" \
            "$AGENTLAB_ROOT/multi-repo-evaluation-case.json"
          cp "$AGENTLAB_ROOT/case/calibration/summary.json" \
            "$AGENTLAB_ROOT/multi-repo-calibration.json"
          if [[ -f "$AGENTLAB_ROOT/case/source/construction/construction-receipt.json" ]]; then
            cp "$AGENTLAB_ROOT/case/source/construction/construction-receipt.json" \
              "$AGENTLAB_ROOT/multi-repo-construction-receipt.json"
          fi
          if [[ -f "$AGENTLAB_ROOT/case/source/construction/intent-quality.json" ]]; then
            cp "$AGENTLAB_ROOT/case/source/construction/intent-quality.json" \
              "$AGENTLAB_ROOT/multi-repo-construction-quality.json"
          fi
          python3 scripts/derive-assessment-feedback.py \
            --case "$AGENTLAB_ROOT/multi-repo-evaluation-case.json" \
            --input "$AGENTLAB_ROOT/case-discrimination-input.json" \
            --report "$AGENTLAB_ROOT/case-discrimination-report.json" \
            --output "$AGENTLAB_ROOT/assessment-feedback-candidates.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["AGENTLAB_ROOT"])
          case = json.loads((root / "multi-repo-evaluation-case.json").read_text())
          plan_path = root / "participant-experiment-plan.json"
          plan = json.loads(plan_path.read_text())
          summary = {
              "schema": "agentlab.multi_repo_assessed_campaign_summary.v1",
              "taskId": case["id"],
              "sourceSetSha256": case["sourceSetSha256"],
              "methodRevision": os.environ["GITHUB_SHA"],
              "participantExperimentPlanSha256": hashlib.sha256(plan_path.read_bytes()).hexdigest(),
              "participantProfileCount": plan["participantProfileCount"],
              "trialsPerParticipant": plan["trialsPerParticipant"],
              "automaticPromotion": False,
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
          cat "$AGENTLAB_ROOT/assessment-feedback-candidates.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze relocation-safe Harmony device handoff
        run: |
          python3 scripts/prepare-harmony-assessed-handoff.py \
            --root "$AGENTLAB_ROOT" \
            --output "$AGENTLAB_ROOT/harmony-device-handoff.json"
      - name: Preserve complete model, source, Oracle and scoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-repo-assessed-campaign
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ env.AGENTLAB_ROOT }}/

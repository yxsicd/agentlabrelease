name: Engineering knowledge seed experiment
on:
  push:
    branches: [main]
    paths:
      - 'examples/knowledge-seed/**'
      - 'examples/tablegit-session/**'
      - 'tests/test_knowledge_seed.py'
      - '.github/workflows/knowledge-seed.yml'
  workflow_dispatch:
    inputs:
      capture_run_id:
        type: string
        default: ''
        description: Re-ingest prior knowledge evidence without Agent redispatch
      source:
        type: choice
        options: [fixture, harmony]
        default: fixture
        description: Fixed Python fixture or pinned real Harmony code-workshop analysis
      builder:
        type: choice
        options: [mock, mini]
        default: mock
        description: Builder participant, independently captured
permissions:
  contents: read
jobs:
  knowledge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTLAB_CI_ROOT: /tmp/agentlab-knowledge-experiment
      AGENTLAB_RELEASE_CHANNEL: candidate-20260913-40ecdf4b-sdk-c075105a-linux-x64
      AGENTLAB_COMPOSITION_DIR: release/candidates/40ecdf4b-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate calibration and stable identities
        run: python3 -m unittest discover -s tests -p 'test_knowledge_seed.py'
      - name: Build structure, Skill rows, task and independent mutation calibration
        if: inputs.capture_run_id == '' && inputs.source != 'harmony'
        run: python3 examples/knowledge-seed/run.py --root "$AGENTLAB_CI_ROOT/builder"
      - name: Construct and independently calibrate pinned Harmony knowledge
        if: inputs.capture_run_id == '' && inputs.source == 'harmony'
        run: |
          git clone --no-checkout --depth 1 https://gitcode.com/HarmonyOS_Samples/sample_in_harmonyos.git "$RUNNER_TEMP/harmony-source"
          git -C "$RUNNER_TEMP/harmony-source" fetch --depth 1 origin 7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6
          git -C "$RUNNER_TEMP/harmony-source" checkout --detach FETCH_HEAD
          python3 examples/knowledge-seed/flywheel/run.py --source "$RUNNER_TEMP/harmony-source" --root "$AGENTLAB_CI_ROOT/builder"
      - name: Restore original builder capture without redispatch
        id: replay
        if: inputs.capture_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh run download "$CAPTURE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name engineering-knowledge-seed --dir "$RUNNER_TEMP/prior"
          python3 - <<'PY'
          import pathlib,json,os,shutil
          prior=json.load(open(os.environ['RUNNER_TEMP']+'/source-run.json'))
          assert prior['head_branch']=='main' and prior['path']=='.github/workflows/knowledge-seed.yml'
          target=pathlib.Path(os.environ['AGENTLAB_CI_ROOT'])/'builder/evidence'
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(pathlib.Path(os.environ['RUNNER_TEMP'])/'prior/builder/evidence',target)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('producer_revision='+prior['head_sha']+'\n')
          PY
      - name: Materialize receipt-bound SDK inputs
        run: python3 scripts/channel-input.py --source release/candidates/40ecdf4b-linux-x64 --output "$GITHUB_OUTPUT"
      - name: Install released AgentLab components
        id: install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd python3-websocket
          scripts/ci-public-install-deploy-smoke.sh
      - name: Install isolated builder runtime
        if: inputs.builder == 'mini' && inputs.capture_run_id == ''
        run: |
          python3 -m venv "$RUNNER_TEMP/mini-runtime"
          "$RUNNER_TEMP/mini-runtime/bin/pip" install -r examples/real-code-agent/participant/mini-requirements.lock
      - name: Build maintainer knowledge with a real Agent
        if: inputs.builder == 'mini' && inputs.capture_run_id == ''
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
        run: |
          python3 examples/knowledge-seed/agent_builder.py --root "$AGENTLAB_CI_ROOT/builder"             --agent-python "$RUNNER_TEMP/mini-runtime/bin/python" --gateway "$AGENTLAB_LM_GATEWAY_URL"
      - name: Persist knowledge rows, revise stable Skills and recover both versions
        if: steps.install.outcome == 'success'
        env:
          AGENTLAB_CAPTURE_PRODUCER_REVISION: ${{ steps.replay.outputs.producer_revision }}
          AGENTLAB_CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          mapfile -t runtime < <(python3 - <<'PY'
          import json
          lock=json.load(open('release/candidates/40ecdf4b-linux-x64/environment-lock.json'))
          print(lock['images'][0]['reference'])
          print(next(c['volume'] for c in lock['components'] if c['slot']=='release'))
          PY
          )
          /usr/bin/python3 examples/tablegit-session/run.py --image "${runtime[0]}" --runtime-volume "${runtime[1]}" \
            --sdk-program release/candidates/40ecdf4b-linux-x64/session-sdk.json \
            --root "$AGENTLAB_CI_ROOT/store" --capture-evidence "$AGENTLAB_CI_ROOT/builder/evidence" --capture-agent-kind "knowledge-builder-${{ inputs.builder || 'mock' }}"
      - name: Preserve calibration failures, raw capture and historical readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-knowledge-seed
          path: |
            ${{ env.AGENTLAB_CI_ROOT }}/builder/evidence/
            ${{ env.AGENTLAB_CI_ROOT }}/store/evidence-*/

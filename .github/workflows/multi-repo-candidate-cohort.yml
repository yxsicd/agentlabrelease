name: Multi-repository candidate cohort proposal
on:
  workflow_dispatch:
    inputs:
      cohort_id:
        description: Stable identifier for this predeclared sampling frame
        required: true
        type: string
      analysis_run_id:
        description: Successful trusted-main multi-repository exact-analysis run
        required: true
        type: string
      expected_analysis_run_sha256:
        description: Exact analysis-run digest inspected before cohort proposal
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTLAB_ROOT: ${{ github.workspace }}/.agentlab-work/multi-repo-candidate-cohort
      COHORT_ID: ${{ inputs.cohort_id }}
      SOURCE_RUN_ID: ${{ inputs.analysis_run_id }}
      EXPECTED_ANALYSIS_RUN_SHA256: ${{ inputs.expected_analysis_run_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify and recover exact multi-repository analysis evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$AGENTLAB_ROOT/analysis-source"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$AGENTLAB_ROOT/analysis-source-run.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ["AGENTLAB_ROOT"] + "/analysis-source-run.json"))
          assert value["head_branch"] == "main"
          assert value["path"] == ".github/workflows/multi-repo-analysis.yml"
          assert value["event"] == "workflow_dispatch"
          assert value["conclusion"] == "success"
          PY
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name multi-repo-analysis --dir "$AGENTLAB_ROOT/analysis-source"
          python3 scripts/multi-repo-analysis-run.py validate \
            --root "$AGENTLAB_ROOT/analysis-source" \
            --run "$AGENTLAB_ROOT/analysis-source/analysis-run.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["AGENTLAB_ROOT"])
          path = root / "analysis-source/analysis-run.json"
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == os.environ["EXPECTED_ANALYSIS_RUN_SHA256"]
          run = json.loads(path.read_text())
          metadata = json.loads((root / "analysis-source-run.json").read_text())
          assert run["methodRevision"] == metadata["head_sha"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("ANALYSIS_METHOD_REVISION=" + run["methodRevision"] + "\n")
          PY
      - name: Propose the complete eligible sampling frame
        run: |
          python3 scripts/propose-multi-repo-candidate-cohort.py \
            --difficulty "$AGENTLAB_ROOT/analysis-source/analysis/difficulty_candidates.json" \
            --cohort-id "$COHORT_ID" \
            --method-revision "$ANALYSIS_METHOD_REVISION" \
            --output "$AGENTLAB_ROOT/candidate-cohort-proposal.json"
          sha256sum "$AGENTLAB_ROOT/candidate-cohort-proposal.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve proposal and exact analyzer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-repo-candidate-cohort-proposal
          if-no-files-found: error
          path: ${{ env.AGENTLAB_ROOT }}/

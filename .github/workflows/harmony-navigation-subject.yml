          from pathlib import Path
          root=Path(os.environ['AGENTLAB_CI_ROOT']); out=root/'seed-candidate'; out.mkdir()
          exports=sorted(root.glob('store/evidence-*/experience/promotion-export/export.json'))
          summaries=sorted(root.glob('store/evidence-*/experience/summary.json'))
          assert len(exports)==1 and len(summaries)==1,(exports,summaries)
          export=exports[0].parent; summary=json.loads(summaries[0].read_text())
          assert summary['ok'] is True and summary['promotionExplicit'] is True
          assert summary['promotionAppliedToActiveKnowledge'] is False
          shutil.copytree(export,out/'promotion-export')
          h=hashlib.sha256()
          for p in sorted((out/'promotion-export').rglob('*')):

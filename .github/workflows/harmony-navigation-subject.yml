          subject=json.loads((root/'assessment/evidence/summary.json').read_text())
          manifest=dict(schema='agentlab.seed_guidance.v1',scenario=os.environ['AGENTLAB_ASSESSMENT_SCENARIO'],sourceRunId=os.environ['GITHUB_RUN_ID'],captureRunId=os.environ['AGENTLAB_CAPTURE_RUN_ID'],promotionOk=summary['ok'],promotionExplicit=summary['promotionExplicit'],promotionAppliedToActiveKnowledge=summary['promotionAppliedToActiveKnowledge'],verifiedLessonId=summary['verifiedLessonId'],candidateDigest=h.hexdigest(),subjectTaskSucceeded=subject.get('subjectTaskSucceeded'),sourceForkQualified=subject.get('sourceForkQualified'))
          (out/'seed-guidance.json').write_text(json.dumps(manifest,indent=2)+'\n')

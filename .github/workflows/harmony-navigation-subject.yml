        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/live-agent-result.env"
          import json, os, shlex
          from pathlib import Path
          e=Path(os.environ['AGENTLAB_CI_ROOT'])/'assessment/evidence'
          s=json.loads((e/'summary.json').read_text()) if (e/'summary.json').is_file() else {}
          phases=s.get('phases',{})
          preferred=None
          for name in ('compiler-feedback-repair','timeout-feedback-repair','parent-turn-2','turn-1'):
              if name in phases:
                  preferred=(name,phases[name]); break
          phase,row=preferred if preferred else ('unknown',{})
          behavior=(row.get('behavior') or {}).get('pass')
          build=row.get('build')
          scope=(row.get('scope') or {}).get('drift')
          def word(v): return 'unknown' if v is None else ('pass' if v else 'fail')
          print('LIVE_PHASE='+shlex.quote(phase))
          print('LIVE_BEHAVIOR='+shlex.quote(word(behavior)))
          print('LIVE_BUILD='+shlex.quote(word(build)))
          print('LIVE_SOURCE_CUT='+shlex.quote(str(row.get('sourceCut') or '')))
          print('LIVE_FIRST_MUTATION='+shlex.quote(str((s.get('participantProcess') or [{}])[-1].get('firstSourceMutationMs') or '')))
          print('LIVE_PAYLOAD='+shlex.quote(json.dumps({'scopeDrift':scope,'subjectTaskSucceeded':s.get('subjectTaskSucceeded')})))
          PY
          source "$RUNNER_TEMP/live-agent-result.env"
          mutation=()
          if [[ -n "$LIVE_FIRST_MUTATION" ]]; then mutation+=(--first-mutation-ms "$LIVE_FIRST_MUTATION"); fi
          python3 scripts/cbgroom-live-event.py \
            --kind agent_phase_finished --stage evaluated --status running \
            --phase "$LIVE_PHASE" --behavior-status "$LIVE_BEHAVIOR" \
            --build-status "$LIVE_BUILD" --source-revision "$LIVE_SOURCE_CUT" \
            --payload-json "$LIVE_PAYLOAD" "${mutation[@]}" \
            --summary "Assessed Agent phase completed; behavior/build/scope evidence is available."
      - name: Publish full successful build binaries as experiment evidence

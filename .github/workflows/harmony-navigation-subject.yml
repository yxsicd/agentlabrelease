name: Real staged Harmony subject assessment
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [navigation, feedback, loading, debounce, image-url, cache-durability]
        default: navigation
        description: Frozen TableGit case; independently calibrated submitted methods
      capture_run_id:
        type: string
        default: ''
        description: Replay only TableGit persistence from a completed source capture; no new Agent or HAP
      execution_mode:
        type: choice
        options: [fast, qualification]
        default: qualification
        description: Fast keeps complete subject evidence but skips heavy publication/TableGit qualification
      seed_candidate_run_id:
        type: string
        default: ''
        description: Optional prior qualification run whose verified seed candidate is injected as guidance; frozen task/oracle stay unchanged
      guidance_variant:
        type: choice
        options: [none, budget-v1]
        default: none
        description: Optional repo-versioned experimental overlay on verified guidance; never mutates or promotes the base candidate
      reasoning_effort:
        type: choice
        options: [default, low, medium, high]
        default: default
        description: Operator-side provider reasoning_effort override; Pi thinking mode remains off
      evidence_reasoning_escalation:
        type: boolean
        default: false
        description: Escalate turn2 and fresh fork to high reasoning only after concrete turn1 verifier/compiler failure
      compiler_feedback_only:
        type: boolean
        default: false
        description: After turn1 behavior PASS/build FAIL, continue the same Pi native session with the same turn1 demand and compiler evidence as the only new intervention
      timeout_feedback_only:
        type: boolean
        default: false
        description: After turn1 reproduces timeout-before-source-mutation, continue the same Pi session and same turn1 demand with only observed timeout/no-mutation feedback
      baseline_run_id:
        type: string
        default: ''
        description: Optional prior control run used only for Harness decision-package delta analysis; never changes subject prompts
      prewarm_only:
        type: boolean
        default: false
        description: Populate immutable caches only; do not dispatch or evaluate a subject
      prepare_only:
        type: boolean
        default: false
        description: Prepare and preflight the full fast subject environment without dispatching Agent
      build_cache_probe_only:
        type: boolean
        default: false
        description: Prepare environment and run one frozen-source Harmony build to seed toolchain cache; no Agent dispatch
permissions:
  contents: write
jobs:
  assess:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENTLAB_CI_ROOT: /tmp/agentlab-navigation
      AGENTLAB_COMPOSITION_DIR: release/candidates/harmony-buildkit-v6-linux-x64
      AGENTLAB_RELEASE_CHANNEL: candidate-20260913-harmony-buildkit-v6-linux-x64
      AGENTLAB_ASSESSMENT_SCENARIO: ${{ inputs.scenario || 'navigation' }}
      AGENTLAB_CAPTURE_RUN_ID: ${{ inputs.capture_run_id || github.run_id }}
      AGENTLAB_EXECUTION_MODE: ${{ inputs.execution_mode || 'qualification' }}
      AGENTLAB_PREWARM_ONLY: ${{ inputs.prewarm_only || false }}
      AGENTLAB_PREPARE_ONLY: ${{ inputs.prepare_only || false }}
      AGENTLAB_BUILD_CACHE_PROBE_ONLY: ${{ inputs.build_cache_probe_only || false }}
      AGENTLAB_HARMONY_BUILD_CACHE_HOST: /tmp/agentlab-harmony-toolchain-cache
      AGENTLAB_FAST_SUBJECT_ROOT: /tmp/agentlab-fast-subject
      AGENTLAB_FAST_HARMONY_ROOT: /tmp/agentlab-fast-subject/harmony-cli
      AGENTLAB_FAST_BUILD_KIT_ROOT: /tmp/agentlab-fast-subject/harmony-build-kit
      AGENTLAB_MODEL: glm-5.3-flash
      AGENTLAB_GUIDANCE_VARIANT: ${{ inputs.guidance_variant || 'none' }}
      AGENTLAB_REASONING_EFFORT: ${{ inputs.reasoning_effort || 'default' }}
      AGENTLAB_EVIDENCE_REASONING_ESCALATION: ${{ inputs.evidence_reasoning_escalation || false }}
      AGENTLAB_COMPILER_FEEDBACK_ONLY: ${{ inputs.compiler_feedback_only || false }}
      AGENTLAB_TIMEOUT_FEEDBACK_ONLY: ${{ inputs.timeout_feedback_only || false }}
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fingerprint runner and start experiment timing
        run: |
          mkdir -p "$AGENTLAB_CI_ROOT"
          python3 - <<'PY'
          import json, os, platform, shutil, subprocess, time
          from pathlib import Path
          def out(*cmd):
              try: return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc: return f"unavailable: {exc}"
          root=Path(os.environ['AGENTLAB_CI_ROOT'])
          payload={
            'schema':'agentlab.environment_fingerprint.v1',
            'runId':os.environ.get('GITHUB_RUN_ID'),
            'runnerName':os.environ.get('RUNNER_NAME'),
            'runnerOs':os.environ.get('RUNNER_OS'),
            'runnerArch':os.environ.get('RUNNER_ARCH'),
            'platform':platform.platform(),
            'machine':platform.machine(),
            'cpu':out('bash','-lc',"lscpu | sed -n '1,30p'"),
            'nproc':out('nproc'),
            'memory':out('bash','-lc',"free -b"),
            'disk':out('bash','-lc',"df -B1 / $RUNNER_TEMP"),
            'docker':out('docker','version','--format','{{json .}}'),
            'node':out('node','--version'),
            'python':out('python3','--version'),
            'git':out('git','--version'),
            'executionMode':os.environ.get('AGENTLAB_EXECUTION_MODE'),
            'prewarmOnly':os.environ.get('AGENTLAB_PREWARM_ONLY'),
            'prepareOnly':os.environ.get('AGENTLAB_PREPARE_ONLY'),
            'buildCacheProbeOnly':os.environ.get('AGENTLAB_BUILD_CACHE_PROBE_ONLY'),
            'startedUnixMs':time.time_ns()//1_000_000,
          }
          (root/'environment-fingerprint.json').write_text(json.dumps(payload,indent=2)+'\n')
          (root/'timing.tsv').write_text('phase\tduration_ms\n')
          PY
      - name: Gate assessed dispatch on model readiness before immutable preparation
        id: gateway_readiness
        if: ${{ !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' }}
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          started=$(date +%s%3N)
          mkdir -p "$AGENTLAB_CI_ROOT/gateway-preflight"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'examples/knowledge-seed/subject')
          import run
          root=Path(os.environ['AGENTLAB_CI_ROOT'])/'gateway-preflight'
          result=run.gateway_preflight(root,os.environ.get('AGENTLAB_MODEL','glm-5.3-flash'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out: out.write('ready='+('true' if result['ready'] else 'false')+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as out: out.write('AGENTLAB_GATEWAY_PREFLIGHT_RECEIPT='+str(root/'gateway-preflight.json')+'\n')
          PY
          printf 'gateway_preflight\t%s\n' "$(( $(date +%s%3N) - started ))" >> "$AGENTLAB_CI_ROOT/timing.tsv"
      - name: Restore immutable Harmony source/reference cache
        if: ${{ inputs.capture_run_id == '' && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/source
            ${{ runner.temp }}/reference
          key: harmony-source-reference-v1-7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6-${{ hashFiles('crates/agentlab_code_analysis/**', 'examples/harmony-build/seed/**') }}
      - name: Restore npm download cache
        if: ${{ inputs.capture_run_id == '' && !inputs.build_cache_probe_only && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: agentlab-subject-npm-v1-${{ hashFiles('examples/real-code-agent/participant/package-lock.json', 'examples/knowledge-seed/subject/runtime/package-lock.json') }}
      - name: Restore prepared participant and oracle runtimes
        if: ${{ inputs.capture_run_id == '' && !inputs.build_cache_probe_only && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/pi-runtime
            ${{ runner.temp }}/oracle-runtime
          key: agentlab-subject-runtimes-v1-${{ hashFiles('examples/real-code-agent/participant/package-lock.json', 'examples/knowledge-seed/subject/runtime/package-lock.json') }}
      - name: Restore stable source probe binary
        if: ${{ inputs.capture_run_id == '' && !inputs.build_cache_probe_only && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/agentlab-tools/agentlab-source-probe
          key: agentlab-source-probe-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/agentlab_code_analysis/**') }}
      - name: Restore participant image cache
        if: ${{ inputs.capture_run_id == '' && !inputs.build_cache_probe_only && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/participant-image-cache
          key: agentlab-participant-image-v1-${{ hashFiles('examples/knowledge-seed/subject/participant.Dockerfile', 'examples/knowledge-seed/subject/participant-runtime.sh') }}
      - name: Restore immutable AgentLab composition CAS
        if: ${{ (inputs.execution_mode || 'qualification') == 'qualification' && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/agentlab-public-cas
          key: agentlab-composition-cas-v1-${{ hashFiles('release/candidates/harmony-buildkit-v6-linux-x64/environment-lock.json') }}
      - name: Restore Harmony toolchain build cache
        if: ${{ inputs.capture_run_id == '' && steps.gateway_readiness.outputs.ready != 'false' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agentlab-harmony-toolchain-cache
          key: harmony-toolchain-cache-v1-${{ hashFiles('release/candidates/harmony-buildkit-v6-linux-x64/environment-lock.json') }}
      - name: Reserve immutable experiment source ref before long capture
        if: ${{ !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && (inputs.capture_run_id != '' || steps.gateway_readiness.outputs.ready != 'false') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="evidence-$AGENTLAB_ASSESSMENT_SCENARIO-subject-$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
      - name: Restore immutable scenario capture for persistence replay
        if: ${{ !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id != '' && contains(fromJSON('["loading","debounce","image-url","cache-durability"]'), inputs.scenario) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$AGENTLAB_CI_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AGENTLAB_CAPTURE_RUN_ID" > "$AGENTLAB_CI_ROOT/capture-source.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads((Path(os.environ['AGENTLAB_CI_ROOT'])/'capture-source.json').read_text())
          assert v['status']=='completed' and v['head_branch']=='main'
          assert v['path']=='.github/workflows/harmony-navigation-subject.yml'
          PY
          if gh release download "evidence-$AGENTLAB_ASSESSMENT_SCENARIO-subject-$AGENTLAB_CAPTURE_RUN_ID" --pattern raw-evidence.tar.zst --dir "$RUNNER_TEMP/capture"; then
            tar --zstd -xf "$RUNNER_TEMP/capture/raw-evidence.tar.zst" -C "$AGENTLAB_CI_ROOT"
          else
            gh run download "$AGENTLAB_CAPTURE_RUN_ID" --name "$AGENTLAB_ASSESSMENT_SCENARIO-subject-evidence" --dir "$AGENTLAB_CI_ROOT/raw/$AGENTLAB_CAPTURE_RUN_ID"
          fi
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          r=Path(os.environ['AGENTLAB_CI_ROOT']);e=r/'raw'/os.environ['AGENTLAB_CAPTURE_RUN_ID']
          assert json.loads((e/'frozen-task.json').read_text())['id']=='case-'+os.environ['AGENTLAB_ASSESSMENT_SCENARIO']+'-subject-v1'
          PY
          python3 examples/knowledge-seed/subject/compact-events.py "$AGENTLAB_CI_ROOT/raw/$AGENTLAB_CAPTURE_RUN_ID" --restore
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          r=Path(os.environ['AGENTLAB_CI_ROOT']);e=r/'raw'/os.environ['AGENTLAB_CAPTURE_RUN_ID']
          shutil.copytree(e,r/'assessment/evidence')
          shutil.rmtree(r/'raw')
          PY
      - name: Pin source and calibrate reference outside assessed Workspace
        if: ${{ inputs.capture_run_id == '' && steps.gateway_readiness.outputs.ready != 'false' }}
        run: |
          started=$(date +%s%3N)
          mkdir -p "$AGENTLAB_HARMONY_BUILD_CACHE_HOST"
          if [[ ! -d "$RUNNER_TEMP/source/.git" ]]; then
            git clone --depth 1 https://gitcode.com/HarmonyOS_Samples/sample_in_harmonyos.git "$RUNNER_TEMP/source"
            git -C "$RUNNER_TEMP/source" fetch --depth 1 origin 7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6
            git -C "$RUNNER_TEMP/source" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = 7aa95cac4eca15e39fc6638cdf1de7db6fb70ad6
          if [[ ! -d "$RUNNER_TEMP/reference/patched-source" ]]; then
            cargo run --locked -p agentlab_code_analysis --bin agentlab-harmony-materialize -- "$RUNNER_TEMP/source" "$RUNNER_TEMP/reference" examples/harmony-build/seed
          fi
          mkdir -p "$RUNNER_TEMP/agentlab-tools"
          if [[ ! -x "$RUNNER_TEMP/agentlab-tools/agentlab-source-probe" ]]; then
            cargo build --locked -p agentlab_code_analysis --bin agentlab-source-probe
            cp target/debug/agentlab-source-probe "$RUNNER_TEMP/agentlab-tools/agentlab-source-probe"
          fi
          echo "AGENTLAB_SOURCE_PROBE=$RUNNER_TEMP/agentlab-tools/agentlab-source-probe" >> "$GITHUB_ENV"
          printf 'prepare_source_reference\t%s\n' "$(( $(date +%s%3N) - started ))" >> "$AGENTLAB_CI_ROOT/timing.tsv"
      - name: Install contained participant and independent oracle runtimes
        if: ${{ inputs.capture_run_id == '' && !inputs.build_cache_probe_only && steps.gateway_readiness.outputs.ready != 'false' }}
        run: |
          started=$(date +%s%3N)
          mkdir -p "$RUNNER_TEMP/pi-runtime" "$RUNNER_TEMP/oracle-runtime"
          if [[ ! -f "$RUNNER_TEMP/pi-runtime/node_modules/@mariozechner/pi-coding-agent/dist/cli.js" ]]; then
            rm -rf "$RUNNER_TEMP/pi-runtime"
            mkdir -p "$RUNNER_TEMP/pi-runtime"
            cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/pi-runtime/"
            npm ci --prefix "$RUNNER_TEMP/pi-runtime"
          fi
          if [[ ! -d "$RUNNER_TEMP/oracle-runtime/node_modules/typescript" ]]; then
            rm -rf "$RUNNER_TEMP/oracle-runtime"
            mkdir -p "$RUNNER_TEMP/oracle-runtime"
            cp examples/knowledge-seed/subject/runtime/package*.json "$RUNNER_TEMP/oracle-runtime/"
            npm ci --prefix "$RUNNER_TEMP/oracle-runtime" --ignore-scripts
          fi
          mkdir -p "$RUNNER_TEMP/participant-image-cache"
          AGENTLAB_PARTICIPANT_CACHE_TAR="$RUNNER_TEMP/participant-image-cache/participant-image.tar" \
            bash examples/knowledge-seed/subject/participant-runtime.sh "$RUNNER_TEMP" agentlab-subject-participant:"$GITHUB_RUN_ID"
          echo "AGENTLAB_PARTICIPANT_IMAGE=$(cat "$RUNNER_TEMP/image.txt")" >> "$GITHUB_ENV"
          echo "AGENTLAB_ORACLE_TYPESCRIPT=$RUNNER_TEMP/oracle-runtime/node_modules/typescript" >> "$GITHUB_ENV"
          printf 'prepare_participant_oracle\t%s\n' "$(( $(date +%s%3N) - started ))" >> "$AGENTLAB_CI_ROOT/timing.tsv"
      - name: Restore explicit verified seed guidance
        if: ${{ inputs.seed_candidate_run_id != '' && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/seed-guidance"
          mkdir -p "$RUNNER_TEMP/seed-guidance"
          gh run download "${{ inputs.seed_candidate_run_id }}" --name "$AGENTLAB_ASSESSMENT_SCENARIO-seed-candidate" --dir "$RUNNER_TEMP/seed-guidance"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'seed-guidance'
          m=json.loads((root/'seed-guidance.json').read_text())
          assert m['schema']=='agentlab.seed_guidance.v1'
          assert m['scenario']==os.environ['AGENTLAB_ASSESSMENT_SCENARIO']
          assert m['promotionOk'] is True and m['promotionExplicit'] is True
          assert m['promotionAppliedToActiveKnowledge'] is False
          assert (root/'promotion-export/export.json').is_file()
          PY
      - name: Restore optional baseline decision package
        if: ${{ inputs.baseline_run_id != '' && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/baseline-decision"
          mkdir -p "$RUNNER_TEMP/baseline-decision"
          gh run download "${{ inputs.baseline_run_id }}" --name "$AGENTLAB_ASSESSMENT_SCENARIO-decision-package" --dir "$RUNNER_TEMP/baseline-decision"
          test -f "$RUNNER_TEMP/baseline-decision/decision-package.json"
      - name: Record infrastructure-unavailable decision after lineage restore
        if: ${{ !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' && steps.gateway_readiness.outputs.ready == 'false' }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'examples/knowledge-seed/subject')
          import run
          root=Path(os.environ['AGENTLAB_CI_ROOT'])
          result=json.loads(Path(os.environ['AGENTLAB_GATEWAY_PREFLIGHT_RECEIPT']).read_text())
          guidance_path=Path(os.environ['RUNNER_TEMP'])/'seed-guidance'
          guidance=run.load_guidance(guidance_path,os.environ['AGENTLAB_ASSESSMENT_SCENARIO'],os.environ.get('AGENTLAB_GUIDANCE_VARIANT','none')) if (guidance_path/'seed-guidance.json').is_file() else None
          assert result['ready'] is False
          run.write_infrastructure_unavailable(root/'assessment/evidence',os.environ['AGENTLAB_ASSESSMENT_SCENARIO'],guidance,result)
          PY
      - name: Install published AgentLab SDK and build-kit
        if: ${{ (inputs.capture_run_id == '' || (inputs.execution_mode || 'qualification') == 'qualification') && steps.gateway_readiness.outputs.ready != 'false' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENTLAB_CAS_DIR: ${{ runner.temp }}/agentlab-public-cas
          AGENTLAB_FETCH_ONLY: ${{ inputs.prewarm_only }}
          AGENTLAB_INSTALL_ONLY: ${{ inputs.prepare_only || inputs.build_cache_probe_only }}
          AGENTLAB_SUBJECT_ONLY: ${{ !inputs.prewarm_only && (inputs.execution_mode || 'qualification') == 'fast' }}
          AGENTLAB_TIMING_FILE: ${{ env.AGENTLAB_CI_ROOT }}/timing.tsv
        run: |
          started=$(date +%s%3N)
          if [[ "$AGENTLAB_EXECUTION_MODE" == "qualification" ]]; then
            sudo apt-get update
            sudo apt-get install --yes zstd python3-websocket
            scripts/ci-public-install-deploy-smoke.sh
          else
            command -v zstd >/dev/null
            bash scripts/ci-fast-subject-install.sh
          fi
          printf 'install_agentlab_harmony\t%s\n' "$(( $(date +%s%3N) - started ))" >> "$AGENTLAB_CI_ROOT/timing.tsv"
      - name: Seed Harmony toolchain cache with frozen-source build
        if: ${{ inputs.build_cache_probe_only && inputs.capture_run_id == '' }}
        run: |
          started=$(date +%s%3N)
          python3 examples/knowledge-seed/subject/run.py --scenario "$AGENTLAB_ASSESSMENT_SCENARIO" \
            --source "$RUNNER_TEMP/source" --reference "$RUNNER_TEMP/reference/patched-source" \
            --root "$AGENTLAB_CI_ROOT/build-cache-probe" --install-root "$AGENTLAB_CI_ROOT" \
            --pi-runtime "$RUNNER_TEMP/pi-runtime" --image "$AGENTLAB_PARTICIPANT_IMAGE" --build-cache-probe-only
          printf 'build_cache_probe\t%s\n' "$(( $(date +%s%3N) - started ))" >> "$AGENTLAB_CI_ROOT/timing.tsv"
      - name: Real parent two turns and fresh-Agent source fork; retain Agent failures
        if: ${{ !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' && steps.gateway_readiness.outputs.ready != 'false' }}
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          started=$(date +%s%3N)
          retain_hap=()
          if [[ "${{ inputs.execution_mode || 'qualification' }}" == qualification ]]; then retain_hap+=(--retain-hap-bytes); fi
          guidance=()
          if [[ -f "$RUNNER_TEMP/seed-guidance/seed-guidance.json" ]]; then guidance+=(--guidance "$RUNNER_TEMP/seed-guidance"); fi
          compiler_feedback=()
          if [[ "$AGENTLAB_COMPILER_FEEDBACK_ONLY" == true ]]; then compiler_feedback+=(--compiler-feedback-only); fi
          timeout_feedback=()
          if [[ "$AGENTLAB_TIMEOUT_FEEDBACK_ONLY" == true ]]; then timeout_feedback+=(--timeout-feedback-only); fi
          python3 examples/knowledge-seed/subject/run.py --scenario "$AGENTLAB_ASSESSMENT_SCENARIO" --source "$RUNNER_TEMP/source" --reference "$RUNNER_TEMP/reference/patched-source" --root "$AGENTLAB_CI_ROOT/assessment" --install-root "$AGENTLAB_CI_ROOT" --pi-runtime "$RUNNER_TEMP/pi-runtime" --image "$AGENTLAB_PARTICIPANT_IMAGE" --guidance-variant "$AGENTLAB_GUIDANCE_VARIANT" "${retain_hap[@]}" "${guidance[@]}" "${compiler_feedback[@]}" "${timeout_feedback[@]}"
          cp "$RUNNER_TEMP/participant-image.json" "$AGENTLAB_CI_ROOT/assessment/evidence/participant-image.json"
          cp "$RUNNER_TEMP/participant-runtime-preflight.txt" "$AGENTLAB_CI_ROOT/assessment/evidence/participant-runtime-preflight.txt"
          printf 'participant_and_verify\t%s\n' "$(( $(date +%s%3N) - started ))" >> "$AGENTLAB_CI_ROOT/timing.tsv"
      - name: Publish full successful build binaries as experiment evidence
        id: publish_hap_release
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' && (inputs.execution_mode || 'qualification') == 'qualification' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f "$AGENTLAB_CI_ROOT/assessment/evidence/binary-manifest.json" ]]; then exit 0; fi
          tag="evidence-$AGENTLAB_ASSESSMENT_SCENARIO-subject-$GITHUB_RUN_ID"
          gh release create "$tag" --prerelease --title "$AGENTLAB_ASSESSMENT_SCENARIO subject evidence $GITHUB_RUN_ID" --notes "Real Pi / glm-5.3-flash staged assessment. Successful unsigned HAP binaries; inspect behavior verdicts independently. Source-only fresh-Agent fork, no formal SessionFS/device/fixed promotion." "$AGENTLAB_CI_ROOT/assessment/full-hap/"*.hap "$AGENTLAB_CI_ROOT/assessment/evidence/binary-manifest.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          e=Path(os.environ['AGENTLAB_CI_ROOT'])/'assessment/evidence'
          rows=json.loads((e/'binary-manifest.json').read_text())
          for row in rows:row['uri']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/evidence-'+os.environ['AGENTLAB_ASSESSMENT_SCENARIO']+'-subject-'+os.environ['GITHUB_RUN_ID']+'/'+row['filename']

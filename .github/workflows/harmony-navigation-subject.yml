      - name: Persist flywheel facts through cbgroom MCP
        id: persist_cbgroom
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && steps.gateway_readiness.outputs.ready != 'false' }}
        env:
          AGENTLAB_TABLEGIT_MCP_URL: ${{ vars.AGENTLAB_TABLEGIT_MCP_URL }}
          AGENTLAB_TABLEGIT_PERSON_ID: ${{ vars.AGENTLAB_TABLEGIT_PERSON_ID }}
        run: |
          set -euo pipefail
          test -n "$AGENTLAB_TABLEGIT_MCP_URL"
          test -n "$AGENTLAB_TABLEGIT_PERSON_ID"
          asset_run_id="$AGENTLAB_CAPTURE_RUN_ID"
          inspector=(npx --yes --package node@22.20.0 --package @modelcontextprotocol/inspector@2.6.0 mcp-inspector --cli "$AGENTLAB_TABLEGIT_MCP_URL" --transport http --format json)
          sentinel="evidence-$asset_run_id-summary"
          python3 - "$AGENTLAB_TABLEGIT_PERSON_ID" "$sentinel" > "$RUNNER_TEMP/cbgroom-query-args.json" <<'PY'
          import json,sys
          person,key=sys.argv[1:]
          print(json.dumps({
            'skill_id':'table.query','skill_version':'2.2.0','operation':'table_query','caller_person_id':person,
            'arguments':{'repo':'agentlabtablegit','path':'evidence_refs','keys':[key],'limit':1}
          },separators=(',',':')))
          PY
          "${inspector[@]}" --method tools/call --tool-name skill_run_read --tool-args-json "$(cat "$RUNNER_TEMP/cbgroom-query-args.json")" > "$RUNNER_TEMP/cbgroom-preflight.json"
          python3 - "$RUNNER_TEMP/cbgroom-preflight.json" > "$RUNNER_TEMP/cbgroom-state.env" <<'PY'
          import json,shlex,sys
          outer=json.load(open(sys.argv[1])); structured=outer['result']['structuredContent']
          assert structured['outcome']=='executed',structured
          result=structured['result']
          print('CBGROOM_REVISION='+shlex.quote(result['revision']))
          print('CBGROOM_ALREADY_PERSISTED='+('true' if result['returned_count'] else 'false'))
          PY
          source "$RUNNER_TEMP/cbgroom-state.env"
          if [[ "$CBGROOM_ALREADY_PERSISTED" == true ]]; then
            echo "source run $asset_run_id already exists in cbgroom; idempotent no-op"
            exit 0
          fi
          python3 scripts/build-cbgroom-flywheel-transaction.py \
            --evidence "$AGENTLAB_CI_ROOT/assessment/evidence" \
            --revision "$CBGROOM_REVISION" \
            --run-id "$asset_run_id" \
            --github-repository "$GITHUB_REPOSITORY" \
            --caller-person-id "$AGENTLAB_TABLEGIT_PERSON_ID" \
            --output "$RUNNER_TEMP/cbgroom-transaction.json"
          "${inspector[@]}" --method tools/call --tool-name skill_run_write --tool-args-json "$(cat "$RUNNER_TEMP/cbgroom-transaction.json")" > "$RUNNER_TEMP/cbgroom-write.json"
          python3 - "$RUNNER_TEMP/cbgroom-write.json" > "$RUNNER_TEMP/cbgroom-write-state.env" <<'PY'
          import json,shlex,sys
          outer=json.load(open(sys.argv[1])); structured=outer['result']['structuredContent']
          assert structured['outcome']=='executed',structured
          result=structured['result']; assert not result.get('conflicts'),result
          assert result.get('applied') or result.get('outcome')=='idempotent_replay',result
          print('CBGROOM_WRITTEN_REVISION='+shlex.quote(result['revision']))
          PY
          source "$RUNNER_TEMP/cbgroom-write-state.env"
          "${inspector[@]}" --method tools/call --tool-name skill_run_read --tool-args-json "$(cat "$RUNNER_TEMP/cbgroom-query-args.json")" > "$RUNNER_TEMP/cbgroom-readback.json"
          python3 - "$RUNNER_TEMP/cbgroom-readback.json" "$asset_run_id" "$sentinel" "$CBGROOM_WRITTEN_REVISION" <<'PY'
          import json,sys
          outer=json.load(open(sys.argv[1])); structured=outer['result']['structuredContent']
          assert structured['outcome']=='executed',structured
          result=structured['result']
          assert result['returned_count']==1,result
          row=result['rows'][0]
          assert row['key']==sys.argv[3],row
          assert row['row']['id']==sys.argv[3],row
          assert row['row']['producerRun']==sys.argv[2],row
          print(json.dumps({'ok':True,'writtenRevision':sys.argv[4],'readRevision':result['revision'],'rowVersion':row['row_version']},sort_keys=True))
          PY
      - name: Stream evidence persistence to cbgroom

          python3 examples/knowledge-seed/subject/run.py --scenario "$AGENTLAB_ASSESSMENT_SCENARIO" --source "$RUNNER_TEMP/source" --reference "$RUNNER_TEMP/reference/patched-source" --root "$AGENTLAB_CI_ROOT/assessment" --install-root "$AGENTLAB_CI_ROOT" --pi-runtime "$RUNNER_TEMP/pi-runtime" --image "$AGENTLAB_PARTICIPANT_IMAGE" --guidance-variant "$AGENTLAB_GUIDANCE_VARIANT" "${retain_hap[@]}" "${guidance[@]}" "${compiler_feedback[@]}" "${timeout_feedback[@]}" "${timeout_verification[@]}" "${resume_checkpoint[@]}"

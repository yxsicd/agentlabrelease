          if-no-files-found: error
          path: ${{ env.AGENTLAB_CI_ROOT }}/seed-candidate/
      - name: Publish complete TableGit history and analysis evidence
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && (inputs.execution_mode || 'qualification') == 'qualification' && contains(fromJSON('["loading","debounce","image-url","cache-durability"]'), inputs.scenario) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="evidence-$AGENTLAB_ASSESSMENT_SCENARIO-subject-$GITHUB_RUN_ID"
          mapfile -t evidence_dirs < <(python3 - <<'PY'
          import os
          from pathlib import Path
          for path in sorted((Path(os.environ['AGENTLAB_CI_ROOT'])/'store').glob('evidence-*')):print('store/'+path.name)
          PY
          )
          tar -C "$AGENTLAB_CI_ROOT" -cf - normalized-runtime evaluation-inputs "${evidence_dirs[@]}" | zstd -q -o "$AGENTLAB_CI_ROOT/tablegit-runtime.tar.zst"
          gh release upload "$tag" "$AGENTLAB_CI_ROOT/tablegit-runtime.tar.zst"
      - name: Compact raw participant event streams after analysis
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' }}
        run: |
          python3 examples/knowledge-seed/subject/compact-events.py "$AGENTLAB_CI_ROOT/assessment/evidence"
      - name: Preserve complete supervisor capture, partial/failed Agent events and source cuts
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.scenario || 'navigation' }}-subject-evidence
          path: ${{ env.AGENTLAB_CI_ROOT }}/assessment/evidence/
      - name: Preserve lightweight Harness decision package
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.scenario || 'navigation' }}-decision-package
          if-no-files-found: warn
          path: |
            ${{ env.AGENTLAB_CI_ROOT }}/assessment/evidence/decision-package.json
            ${{ env.AGENTLAB_CI_ROOT }}/assessment/evidence/decision-comparison.json
      - name: Preserve environment fingerprint and timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.scenario || 'navigation' }}-experiment-metrics
          path: |
            ${{ env.AGENTLAB_CI_ROOT }}/environment-fingerprint.json
            ${{ env.AGENTLAB_CI_ROOT }}/timing.tsv
      - name: Preserve no-Agent build-cache probe evidence
        if: ${{ always() && inputs.build_cache_probe_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.scenario || 'navigation' }}-build-cache-probe
          if-no-files-found: error
          path: ${{ env.AGENTLAB_CI_ROOT }}/build-cache-probe/evidence/
      - name: Preserve full HAP binaries even when Release publication fails
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && inputs.capture_run_id == '' && (inputs.execution_mode || 'qualification') == 'qualification' && steps.publish_hap_release.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.scenario || 'navigation' }}-full-hap-evidence
          compression-level: 0
          path: ${{ env.AGENTLAB_CI_ROOT }}/assessment/full-hap/*.hap
      - name: Preserve typed entities and TableGit failures
        if: ${{ always() && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only && (inputs.execution_mode || 'qualification') == 'qualification' && contains(fromJSON('["loading","debounce","image-url","cache-durability"]'), inputs.scenario) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.scenario }}-tablegit-evidence
          path: |
            ${{ env.AGENTLAB_CI_ROOT }}/normalized-runtime/
            ${{ env.AGENTLAB_CI_ROOT }}/evaluation-inputs/
            ${{ env.AGENTLAB_CI_ROOT }}/store/evidence-*/
      - name: Stream run completion to cbgroom
        continue-on-error: true
        if: ${{ always() && inputs.capture_run_id == '' && !inputs.prewarm_only && !inputs.prepare_only && !inputs.build_cache_probe_only }}
        env:
          LIVE_PERSISTENCE_OUTCOME: ${{ steps.persist_cbgroom.outcome }}
        run: |
          persistence="${LIVE_PERSISTENCE_OUTCOME:-unknown}"
          python3 scripts/cbgroom-live-event.py \
            --kind run_finished --stage finished --status completed --completed \
            --persistence-status "$persistence" \
            --payload-json "{\"persistenceOutcome\":\"$persistence\"}" \
            --summary "Workflow reached its final reporting milestone; inspect behavior/build events for scientific verdict."

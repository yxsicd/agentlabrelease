name: Maintainer source recipe construction
run-name: ${{ inputs.coordinator_request_id && format('AgentLab gap {0}', inputs.coordinator_request_id) || 'Maintainer source recipe construction' }}
on:
  workflow_dispatch:
    inputs:
      coordinator_request_id:
        description: Optional original gap-dispatch identity for read-only run recovery
        required: false
        default: ''
        type: string
      expected_method:
        description: Optional exact Release commit required by the gap coordinator
        required: false
        default: ''
        type: string
      repository:
        description: Repository selector; source-only gap selected by strict Rust planner
        default: code-workshop
        required: true
        type: string
      model:
        default: glm-5.3-flash
        required: true
        type: string
      knowledge_directory:
        description: Checked-in fixed committed knowledge cut; exact live revision preflight remains required
        default: examples/maintainer-knowledge-gate/first-four
        required: true
        type: string
      guidance_selection:
        description: Optional checked-in exact-cut calibration selection with sourceRecipeTarget; no external URL
        default: ''
        required: false
        type: string
      dependency_context_paths:
        description: Optional newline-separated exact dependency paths; pinned read-only context, not edits
        default: ''
        required: false
        type: string
      guidance_mode:
        description: Same reviewed construction target and budgets; only guided receives the selected knowledge body
        default: guided
        required: true
        type: choice
        options: [guided, unguided]
      provider_route:
        default: glm
        required: true
        type: string
      reasoning_effort:
        description: Provider-supported reasoning setting; default omits the field, none is an explicit value
        default: low
        required: true
        type: choice
        options: [default, none, low, medium, high, max]
      gateway_timeout_seconds:
        description: Absolute upstream wall-time limit; independent of output token ceiling
        default: '180'
        required: true
        type: choice
        options: ['60', '120', '180']
      code_gateway_timeout_seconds:
        description: Code-only observation cohort; inherit preserves existing deadlines, 240 needs measured late content evidence
        default: inherit
        required: true
        type: choice
        options: [inherit, '180', '240']
      max_output_tokens:
        description: Constructor output token ceiling; includes provider reasoning tokens where applicable
        default: '16384'
        required: true
        type: choice
        options: ['8192', '16384']
      thinking_type:
        description: Provider-supported thinking.type; default omits the independent field
        default: default
        required: true
        type: choice
        options: [default, enabled, disabled]
      response_format:
        description: Provider-supported output mode; default omits the field
        default: default
        required: true
        type: choice
        options: [default, json-object]
      api:
        description: Exact provider wire protocol; catalog identity does not imply protocol compatibility
        default: openai-completions
        required: true
        type: choice
        options: [openai-completions, openai-responses]
      revision_parent_run:
        description: Optional completed constructor Action run for one independently reviewed revision
        default: ''
        required: false
        type: string
      revision_feedback:
        description: Typed review, successor, continuation or early-design-review enrollment; never approval
        default: ''
        required: false
        type: string
      design_first:
        description: Validate scenario expectations and exact source transformations before code generation
        default: true
        required: true
        type: boolean
      design_revisions:
        description: Maximum same-session design corrections; source/knowledge or transport failures never retry
        default: '1'
        required: true
        type: choice
        options: ['0', '1', '2']
      code_revisions:
        description: Fresh-root only; automatic frozen-design verifier repairs after contained baseline diagnostics
        default: '0'
        required: true
        type: choice
        options: ['0', '1', '2']
      independent_review:
        description: Freeze a common rubric before construction and automatically review the completed original suite
        default: false
        required: true
        type: boolean
      review_rubric:
        description: Checked-in repository-independent quality rubric; required only for automatic review
        default: ''
        required: false
        type: string
      review_rubric_sha256:
        description: Exact rubric bytes SHA256 frozen before any model call
        default: ''
        required: false
        type: string
      review_repair_limit:
        description: Shared existing bounded independent citation-repair policy; no constructor retries
        default: '0'
        required: true
        type: choice
        options: ['0', '1']
permissions:
  contents: read
  actions: read
concurrency:
  group: maintainer-source-recipe-author
  cancel-in-progress: false
jobs:
  construct:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: ${{ (inputs.independent_review || contains(inputs.revision_feedback, 'agentlab.source_design_review_action_enrollment.v1')) && 45 || inputs.code_gateway_timeout_seconds == '240' && 25 || 20 }}
    env:
      KNOWLEDGE: ${{ inputs.knowledge_directory }}
      AGENTLAB_SOURCE_GUIDANCE_SELECTION: ${{ inputs.guidance_selection }}
      AGENTLAB_SOURCE_GUIDANCE_MODE: ${{ inputs.guidance_mode }}
      REPOSITORY_SELECTOR: ${{ inputs.repository }}
      DEPENDENCY_CONTEXT_PATHS: ${{ inputs.dependency_context_paths }}
      AGENTLAB_MODEL: ${{ inputs.model }}
      AGENTLAB_PROVIDER_ROUTE: ${{ inputs.provider_route }}
      CONSTRUCTION_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      CONSTRUCTION_GATEWAY_TIMEOUT: ${{ inputs.gateway_timeout_seconds }}
      CONSTRUCTION_CODE_GATEWAY_TIMEOUT: ${{ inputs.code_gateway_timeout_seconds }}
      CONSTRUCTION_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
      CONSTRUCTION_THINKING_TYPE: ${{ inputs.thinking_type }}
      CONSTRUCTION_RESPONSE_FORMAT: ${{ inputs.response_format }}
      CONSTRUCTION_API: ${{ inputs.api }}
      REVISION_PARENT_RUN: ${{ inputs.revision_parent_run }}
      REVISION_FEEDBACK: ${{ inputs.revision_feedback }}
      CONSTRUCTION_DESIGN_FIRST: ${{ inputs.design_first }}
      CONSTRUCTION_DESIGN_REVISIONS: ${{ inputs.design_revisions }}
      DESIGN_QUALITY_RUBRIC: ''
      DESIGN_QUALITY_RUBRIC_SHA256: ''
      CONSTRUCTION_CODE_REVISIONS: ${{ inputs.code_revisions }}
      AUTOMATIC_REVIEW_ENABLED: ${{ inputs.independent_review }}
      AUTOMATIC_REVIEW_RUBRIC: ${{ inputs.review_rubric }}
      AUTOMATIC_REVIEW_RUBRIC_SHA256: ${{ inputs.review_rubric_sha256 }}
      AUTOMATIC_REVIEW_REPAIR_LIMIT: ${{ inputs.review_repair_limit }}
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
      AGENTLAB_TABLEGIT_MCP_URL: ${{ vars.AGENTLAB_TABLEGIT_MCP_URL }}
      AGENTLAB_TABLEGIT_PERSON_ID: ${{ vars.AGENTLAB_TABLEGIT_PERSON_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fence coordinator method before execution
        env:
          EXPECTED_METHOD: ${{ inputs.expected_method }}
        run: |
          if test -n "$EXPECTED_METHOD"; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_METHOD"
          fi
      - name: Validate explicit revision input pairing
        id: input_mode
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          knowledge=os.environ['KNOWLEDGE']
          assert knowledge and not knowledge.startswith('/') and chr(92) not in knowledge
          assert all(p not in ('','.','..') for p in knowledge.split('/'))
          cut=Path(knowledge);root=Path.cwd().resolve()
          assert cut.is_dir() and not cut.is_symlink() and cut.resolve().is_relative_to(root)
          manifest=cut/'maintainer-knowledge-cut.json'
          assert manifest.is_file() and not manifest.is_symlink() and manifest.resolve().is_relative_to(root)
          run=os.environ['REVISION_PARENT_RUN'];feedback=os.environ['REVISION_FEEDBACK']
          parsed=json.loads(feedback) if feedback else None
          successor=feedback if isinstance(parsed,dict) and parsed.get('schema')=='agentlab.source_reviewed_successor_enrollment.v1' else ''
          continuation=feedback if isinstance(parsed,dict) and parsed.get('schema')=='agentlab.baseline_continuation_action_enrollment.v1' else ''
          early_config=parsed if isinstance(parsed,dict) and parsed.get('schema')=='agentlab.source_design_review_action_enrollment.v1' else None
          frozen=successor or continuation
          assert not run if frozen or early_config else bool(run)==bool(feedback),'Legacy revision parent and review must be supplied together'
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('reviewed_successor='+('true' if successor else 'false')+'\n')
              stream.write('baseline_continuation='+('true' if continuation else 'false')+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('REVIEWED_SUCCESSOR='+json.dumps(parsed,separators=(',',':'))+'\n' if successor else 'REVIEWED_SUCCESSOR=\n')
              stream.write('BASELINE_CONTINUATION='+json.dumps(parsed,separators=(',',':'))+'\n' if continuation else 'BASELINE_CONTINUATION=\n')
          if frozen:
              assert not run and len(frozen.encode())<=16384
              assert os.environ['GITHUB_RUN_ATTEMPT']=='1','Workflow rerun cannot reopen a successor enrollment'
              assert os.environ['CONSTRUCTION_DESIGN_FIRST']=='false'
              assert os.environ['CONSTRUCTION_DESIGN_REVISIONS']=='0' and os.environ['CONSTRUCTION_CODE_REVISIONS']=='0'
              assert os.environ['CONSTRUCTION_GATEWAY_TIMEOUT']=='180' and os.environ['CONSTRUCTION_CODE_GATEWAY_TIMEOUT']=='inherit'
              assert os.environ['CONSTRUCTION_MAX_OUTPUT_TOKENS']=='16384'
              assert os.environ['CONSTRUCTION_API']=='openai-completions'
              assert os.environ['CONSTRUCTION_THINKING_TYPE']=='default' and os.environ['CONSTRUCTION_RESPONSE_FORMAT']=='default'
              assert isinstance(json.loads(frozen),dict)
              if continuation:
                  assert not os.environ.get('AGENTLAB_SOURCE_GUIDANCE_SELECTION'),'Baseline continuation does not support a new guidance treatment'
          repairs=int(os.environ['CONSTRUCTION_CODE_REVISIONS'])
          selection=os.environ['AGENTLAB_SOURCE_GUIDANCE_SELECTION']
          if selection:
              from pathlib import Path
              assert not selection.startswith('/') and chr(92) not in selection
              assert all(p not in ('','.','..') for p in selection.split('/'))
              path=Path(selection)
              assert path.is_file() and not path.is_symlink()
              root=Path.cwd().resolve();assert path.resolve().is_relative_to(root)
              assert len(path.read_bytes())<=2*1024*1024
          assert 0<=repairs<=2
          assert not repairs or (not run and os.environ['CONSTRUCTION_DESIGN_FIRST']=='true'),'Automatic code repair requires a fresh design-first root; old review budgets remain exhausted'
          if run:
              assert run.isascii() and run.isdigit() and 0<len(run)<=20 and int(run)>0
              assert len(feedback.encode())<=16384
              assert isinstance(json.loads(feedback),dict)
              if json.loads(feedback).get('schema') in ('agentlab.source_recipe_design_review.v1','agentlab.source_recipe_design_review.v2','agentlab.source_recipe_design_review.v3'):
                  assert os.environ['CONSTRUCTION_DESIGN_FIRST']=='true','Design review requires design-first'
          if early_config is not None:
              import hashlib,re
              assert len(feedback.encode())<=16384,'Early enrollment exceeds bounded envelope'
              assert set(early_config)=={'schema','rubric','rubricSha256'},'Early enrollment fields differ'
              early=early_config['rubric'];early_digest=early_config['rubricSha256']
              assert isinstance(early,str) and isinstance(early_digest,str) and early and early_digest
              assert os.environ['GITHUB_RUN_ATTEMPT']=='1','Early review cannot reopen a rerun budget'
              assert not run and not frozen and selection and os.environ['CONSTRUCTION_DESIGN_FIRST']=='true'
              assert not early.startswith('/') and chr(92) not in early and not any(c in early for c in ('\n','\r','\0')) and all(p not in ('','.','..') for p in early.split('/'))
              path=Path(early);assert path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root)
              raw=path.read_bytes();assert len(raw)<=128*1024 and re.fullmatch('[0-9a-f]{64}',early_digest)
              assert hashlib.sha256(raw).hexdigest()==early_digest
              with open(os.environ['GITHUB_ENV'],'a') as stream:
                  stream.write('DESIGN_QUALITY_RUBRIC='+early+'\nDESIGN_QUALITY_RUBRIC_SHA256='+early_digest+'\n')
          PY
      - name: Bind optional guidance to the checked-in knowledge directory
        run: |
          if test -n "$AGENTLAB_SOURCE_GUIDANCE_SELECTION"; then
            echo "AGENTLAB_SOURCE_GUIDANCE_KNOWLEDGE=$GITHUB_WORKSPACE/$KNOWLEDGE" >> "$GITHUB_ENV"
          fi
      - name: Exact live knowledge admission before model budget
        run: |
          mkdir -p "$RUNNER_TEMP/recipe-author"
          preflight_status=0
          python3 scripts/maintainer-skill-tablegit.py preflight --base "$KNOWLEDGE" \
            --receipt "$RUNNER_TEMP/recipe-author/authority-preflight.json" \
            > "$RUNNER_TEMP/recipe-author/authority-preflight-stdout.log" \
            2> "$RUNNER_TEMP/recipe-author/authority-preflight-stderr.log" || preflight_status=$?
          cat "$RUNNER_TEMP/recipe-author/authority-preflight-stdout.log"
          cat "$RUNNER_TEMP/recipe-author/authority-preflight-stderr.log" >&2
          exit "$preflight_status"
      - name: Freeze optional independent review before construction budget
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          enabled=os.environ['AUTOMATIC_REVIEW_ENABLED']=='true'
          rubric=os.environ['AUTOMATIC_REVIEW_RUBRIC'];digest=os.environ['AUTOMATIC_REVIEW_RUBRIC_SHA256']
          repairs=int(os.environ['AUTOMATIC_REVIEW_REPAIR_LIMIT']);assert repairs in (0,1)
          if not enabled:
              assert not rubric and not digest and repairs==0,'Review inputs require independent_review'
              raise SystemExit(0)
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1','Automatic review enrollment cannot reopen a rerun budget'
          assert os.environ['CONSTRUCTION_DESIGN_FIRST']=='true' or os.environ.get('REVIEWED_SUCCESSOR') or os.environ.get('BASELINE_CONTINUATION'), 'Automatic review requires a fresh design or admitted frozen-design successor'
          assert rubric and not rubric.startswith('/') and chr(92) not in rubric
          assert all(p not in ('','.','..') for p in rubric.split('/'))
          path=Path(rubric);workspace=Path.cwd().resolve()
          assert path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(workspace)
          raw=path.read_bytes();assert len(raw)<=128*1024 and re.fullmatch('[0-9a-f]{64}',digest)
          assert hashlib.sha256(raw).hexdigest()==digest
          policy=json.loads(raw);assert policy['schema']=='agentlab.prospective_source_quality_review.v1'
          assert policy['repositoryAgnostic'] is True and policy['frozenBeforeDispatch'] is True
          if os.environ.get('AGENTLAB_SOURCE_GUIDANCE_SELECTION') and not os.environ.get('REVISION_PARENT_RUN') and (not os.environ.get('REVISION_FEEDBACK') or os.environ.get('DESIGN_QUALITY_RUBRIC')):
              assert any(c.get('id')=='construction-target-coverage' for c in policy['criteria']), 'Fresh targeted review requires construction-target-coverage before model budget'
          root=Path(os.environ['RUNNER_TEMP'])/'recipe-author/automatic-review';root.mkdir()
          with (root/'rubric.json').open('xb') as stream:stream.write(raw)
          enrollment=dict(schema='agentlab.independent_source_suite_review_enrollment.v1',
              mode='same-run-constructor-review',methodRevision=os.environ['GITHUB_SHA'],
              sourceRun=os.environ['GITHUB_RUN_ID'],sourceMethodRevision=os.environ['GITHUB_SHA'],
              sourceArtifact=None,artifactSha256=None,rubricSha256=digest,
              model=os.environ['AGENTLAB_MODEL'],providerRoute=os.environ['AGENTLAB_PROVIDER_ROUTE'],
              reasoningEffort=os.environ['CONSTRUCTION_REASONING_EFFORT'],thinkingType=os.environ['CONSTRUCTION_THINKING_TYPE'],
              responseFormat='json_object',api='openai-completions',
              gatewayTimeoutSeconds=240,maxOutputTokens=int(os.environ['CONSTRUCTION_MAX_OUTPUT_TOKENS']),
              reviewRepairLimit=repairs,maximumReviewerAttempts=1+repairs,
              totalParticipantBudgetSeconds=420*(1+repairs),transportRetryLimit=0,
              sourceAcquisition='native same-run original observation export; not a preexisting Action ZIP',
              automaticPromotion=False,authorityWritePerformed=False,qualified=False)
          with (root/'enrollment.json').open('x') as stream:json.dump(enrollment,stream,indent=2)
          PY
      - name: Build native producer and isolated runtime
        run: |
          cargo build --locked --release -p agentlab_code_analysis --bin agentlab-maintainer-skill-flywheel
          mkdir -p "$RUNNER_TEMP/recipe-pi" "$RUNNER_TEMP/recipe-compiler"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/recipe-pi/"
          cp examples/knowledge-seed/subject/runtime/package*.json "$RUNNER_TEMP/recipe-compiler/"
          npm ci --prefix "$RUNNER_TEMP/recipe-pi" --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/recipe-compiler" --no-audit --no-fund
          docker pull node:24.19.0-bookworm-slim
      - name: Validate frozen review criteria before constructor model budget
        if: inputs.independent_review
        run: |
          target/release/agentlab-maintainer-skill-flywheel --validate-source-quality-rubric \
            --quality-rubric "$RUNNER_TEMP/recipe-author/automatic-review/rubric.json" \
            --output "$RUNNER_TEMP/recipe-author/automatic-review/rubric-validation.json"
      - name: Select operation gap and prepare bounded original-source request
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);knowledge=Path(os.environ['KNOWLEDGE']).resolve()
          output=root/'recipe-author';source=root/'recipe-source'
          gate=Path('target/release/agentlab-maintainer-skill-flywheel').resolve()
          def run(*args): subprocess.run([str(gate),*map(str,args)],check=True)
          run('--resolve-latest-assessment','--base',knowledge,'--output',output/'durable.json')
          baseline=json.loads(Path(json.loads((output/'durable.json').read_bytes())['assessmentPath']).read_bytes())
          args=['--plan-next-round','--scope-skills',knowledge/'maintainer_scope_skills.jsonl','--program-facts',knowledge/'program_facts.jsonl',
                '--operation-receipts-root',knowledge/'operation-evidence','--round-index',baseline['roundIndex'],
                '--available-lane','operation-verification','--available-operation-kind','source-only','--repository',os.environ['REPOSITORY_SELECTOR'],
                '--batch-size',1,'--output',output/'plan.json']
          if baseline.get('parentAssessmentSha256'):args+=['--parent-assessment-sha256',baseline['parentAssessmentSha256']]
          run(*args)
          plan=json.loads((output/'plan.json').read_bytes());assert len(plan['selectedScopeIds'])==1
          scope=next(json.loads(l) for l in (knowledge/'maintainer_scope_skills.jsonl').read_text().splitlines() if json.loads(l)['id']==plan['selectedScopeIds'][0])
          (output/'checkout-request.json').write_text(json.dumps({'scope':scope})+'\n')
          subprocess.run(['bash','scripts/checkout-maintainer-scope.sh',scope['repository'],scope['sourceRevision'],scope['pathBoundary'],str(source),str(output/'checkout-request.json')],check=True)
          node=Path(subprocess.check_output(['which','node'],text=True).strip()).resolve()
          compiler=root/'recipe-compiler/node_modules/typescript/lib/typescript.js'
          policy={'schema':'agentlab.source_recipe_author_policy.v1','program':str(node),'programSha256':hashlib.sha256(node.read_bytes()).hexdigest(),
                  'methodDependencies':[{'path':str(compiler),'sha256':hashlib.sha256(compiler.read_bytes()).hexdigest()}],'automaticPromotion':False}
          (output/'policy.json').write_text(json.dumps(policy)+'\n')
          context_args=[]
          context_paths=os.environ.get('DEPENDENCY_CONTEXT_PATHS','').splitlines()
          if context_paths:
              args=['--prepare-construction-context-object-plan','--knowledge',knowledge,'--source-worktree',source,
                    '--repository',scope['repositoryId'],'--output',output/'dependency-object-plan.json']
              for path in context_paths:args+=['--context-path',path]
              run(*args)
              git_program=Path(subprocess.check_output(['which','git'],text=True).strip()).resolve()
              run('--acquire-construction-context-objects','--knowledge',knowledge,'--source-worktree',source,
                  '--object-plan',output/'dependency-object-plan.json','--git-program',git_program,
                  '--output',output/'dependency-acquisition')
              context_args=['--context-packet',output/'dependency-acquisition/context.json']
          target_args=[]
          selection=os.environ.get('AGENTLAB_SOURCE_GUIDANCE_SELECTION','')
          # A reviewed successor must retain its parent's original request bytes.
          if selection and not os.environ.get('REVISION_PARENT_RUN') and (not os.environ.get('REVISION_FEEDBACK') or os.environ.get('DESIGN_QUALITY_RUBRIC')):
              target_args=['--source-construction-selection',Path(selection).resolve()]
          run('--prepare-source-recipe-author','--knowledge',knowledge,'--source-worktree',source,'--repository',os.environ['REPOSITORY_SELECTOR'],
              '--author-policy',output/'policy.json','--output',output/'request.json',*context_args,*target_args)
          PY
      - name: Bind one reviewed revision to original constructor evidence
        if: inputs.revision_parent_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);output=root/'recipe-author'
          run=os.environ['REVISION_PARENT_RUN'];repo=os.environ['GITHUB_REPOSITORY']
          info=json.loads(subprocess.check_output(['gh','run','view',run,'--repo',repo,'--json','workflowName,event,status']))
          assert info['workflowName']=='Maintainer source recipe construction' and info['event']=='workflow_dispatch' and info['status']=='completed'
          parent=root/'recipe-parent'
          subprocess.run(['gh','run','download',run,'--repo',repo,'--name','unreviewed-source-recipe-'+run,'--dir',str(parent)],check=True)
          assert not (parent/'agent/revision-request.json').exists(),'Only one revision from an original construction is supported'
          if 'sourceRecipeTarget' in json.loads((parent/'request.json').read_bytes()):
              restored=output/'restored-parent-request.json'
              subprocess.run(['target/release/agentlab-maintainer-skill-flywheel','--restore-source-recipe-author-target',
                  '--author-request',str(output/'request.json'),'--parent-author-request',str(parent/'request.json'),
                  '--output',str(restored)],check=True)
              restored.replace(output/'request.json')
          review=output/'review-feedback.json'
          with review.open('x') as f:f.write(os.environ['REVISION_FEEDBACK'])
          if json.loads(review.read_bytes()).get('schema') in ('agentlab.source_recipe_design_review.v1','agentlab.source_recipe_design_review.v2','agentlab.source_recipe_design_review.v3'):
              subprocess.run(['python3','scripts/prepare-source-design-review.py',
                  '--gate','target/release/agentlab-maintainer-skill-flywheel',
                  '--request',str(output/'request.json'),'--parent',str(parent),
                  '--feedback',str(review),'--output',str(output)],check=True)
              raise SystemExit(0)
          args=['target/release/agentlab-maintainer-skill-flywheel','--prepare-source-recipe-revision',
              '--author-request',str(output/'request.json'),'--parent-author-request',str(parent/'request.json'),
              '--proposal',str(parent/'agent/proposal.json'),'--review-feedback',str(review),
              '--output',str(output/'revision-request.json')]
          parent_design=parent/'agent/design.json'
          if parent_design.exists():args+=['--parent-design',str(parent_design)]
          subprocess.run(args,check=True)
          PY
      - name: Acquire and reconstruct completed rejected review before successor budget
        if: steps.input_mode.outputs.reviewed_successor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'recipe-author'
          with (root/'successor-enrollment.json').open('x') as stream:stream.write(os.environ['REVIEWED_SUCCESSOR'])
          PY
          python3 scripts/prepare-reviewed-successor-action.py \
            --enrollment "$RUNNER_TEMP/recipe-author/successor-enrollment.json" \
            --output "$RUNNER_TEMP/recipe-author/retained-successor" \
            --request "$RUNNER_TEMP/recipe-author/request.json" --repository "$GITHUB_REPOSITORY" \
            --gate target/release/agentlab-maintainer-skill-flywheel --source-git-checkout "$RUNNER_TEMP/recipe-source"
      - name: Acquire exact baseline failure and admit prospective continuation
        if: steps.input_mode.outputs.baseline_continuation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'recipe-author'
          with (root/'baseline-continuation-enrollment.json').open('x') as stream:
              stream.write(os.environ['BASELINE_CONTINUATION'])
          PY
          python3 scripts/prepare-baseline-continuation-action.py \
            --enrollment "$RUNNER_TEMP/recipe-author/baseline-continuation-enrollment.json" \
            --output "$RUNNER_TEMP/recipe-author/retained-baseline" \
            --request "$RUNNER_TEMP/recipe-author/request.json" --repository "$GITHUB_REPOSITORY" \
            --gate target/release/agentlab-maintainer-skill-flywheel
      - name: Contain construction Agent without source or host evaluator mounts
        id: contain
        run: |
          mkdir "$RUNNER_TEMP/recipe-case" "$RUNNER_TEMP/recipe-docker-config"
          printf '{"schema":"agentlab.blind_case_participant_bundle.v1","sourceOnly":true,"automaticPromotion":false}\n' > "$RUNNER_TEMP/recipe-case/manifest.json"
          printf '{"auths":{}}\n' > "$RUNNER_TEMP/recipe-docker-config/config.json"
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/prepare-participant-runtime.py --image "$image_id" --pi-runtime "$RUNNER_TEMP/recipe-pi" \
            --case-input "$RUNNER_TEMP/recipe-case" --forbid "$GITHUB_WORKSPACE" --forbid "$RUNNER_TEMP/recipe-source" \
            --forbid "$RUNNER_TEMP/recipe-author" --output "$RUNNER_TEMP/recipe-runtime.json"
          mkdir "$RUNNER_TEMP/recipe-author/runtime-inputs"
          cp "$RUNNER_TEMP/recipe-runtime.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/config.json"
          cp "$RUNNER_TEMP/recipe-case/manifest.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/manifest.json"
          cp "$RUNNER_TEMP/recipe-pi/package-lock.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/package-lock.json"
      - name: Freeze code repair budget before the first model turn
        if: inputs.design_first && inputs.revision_parent_run == ''
        run: |
          target/release/agentlab-maintainer-skill-flywheel --prepare-source-recipe-loop-intent \
            --author-request "$RUNNER_TEMP/recipe-author/request.json" --maximum-repairs "$CONSTRUCTION_CODE_REVISIONS" \
            --output "$RUNNER_TEMP/recipe-author/diagnostic-loop-intent.json"
      - name: Produce captured unreviewed recipe only
        if: steps.input_mode.outputs.reviewed_successor != 'true' && steps.input_mode.outputs.baseline_continuation != 'true'
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-runtime.json
          AGENTLAB_PARTICIPANT_RUNTIME_RECEIPT_ROOT: ${{ runner.temp }}/recipe-author/runtime-receipts
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-docker-config
        run: |
          revision_args=()
          if test -f "$RUNNER_TEMP/recipe-author/revision-request.json"; then
            revision_args=(--revision-request "$RUNNER_TEMP/recipe-author/revision-request.json")
          fi
          if test -f "$RUNNER_TEMP/recipe-author/review-parent-design.json"; then
            revision_args+=(--parent-design "$RUNNER_TEMP/recipe-author/review-parent-design.json" \
              --design-review-feedback "$RUNNER_TEMP/recipe-author/review-feedback.json")
          fi
          if test "$CONSTRUCTION_DESIGN_FIRST" = true; then
            revision_args+=(--design-first)
          fi
          if test -f "$RUNNER_TEMP/recipe-author/diagnostic-loop-intent.json"; then
            revision_args+=(--diagnostic-loop-intent "$RUNNER_TEMP/recipe-author/diagnostic-loop-intent.json")
          fi
          if test "$CONSTRUCTION_CODE_GATEWAY_TIMEOUT" != inherit; then
            revision_args+=(--code-gateway-timeout-seconds "$CONSTRUCTION_CODE_GATEWAY_TIMEOUT")
          fi
          if test -n "$DESIGN_QUALITY_RUBRIC"; then
            revision_args+=(--design-quality-rubric "$GITHUB_WORKSPACE/$DESIGN_QUALITY_RUBRIC" \
              --design-quality-rubric-sha256 "$DESIGN_QUALITY_RUBRIC_SHA256")
          fi
          python3 scripts/run-source-recipe-author.py --request "$RUNNER_TEMP/recipe-author/request.json" \
            --output "$RUNNER_TEMP/recipe-author/agent" --gate target/release/agentlab-maintainer-skill-flywheel \
            --pi "$GITHUB_WORKSPACE/scripts/run-pi-in-docker.py" \
            --reasoning-effort "$CONSTRUCTION_REASONING_EFFORT" \
            --gateway-timeout-seconds "$CONSTRUCTION_GATEWAY_TIMEOUT" \
            --max-output-tokens "$CONSTRUCTION_MAX_OUTPUT_TOKENS" \
            --thinking-type "$CONSTRUCTION_THINKING_TYPE" \
            --response-format "$CONSTRUCTION_RESPONSE_FORMAT" \
            --api "$CONSTRUCTION_API" --design-revisions "$CONSTRUCTION_DESIGN_REVISIONS" "${revision_args[@]}"
      - name: Execute one durable feedback-bound successor
        if: steps.input_mode.outputs.reviewed_successor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-runtime.json
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-docker-config
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'recipe-author';retained=root/'retained-successor'
          inputs=json.loads((retained/'bridge-inputs.json').read_bytes())
          command=['python3','scripts/run-reviewed-source-successor.py','--prepared-output',
                   '--output',str(root),'--request',str(root/'request.json'),
                   '--gate','target/release/agentlab-maintainer-skill-flywheel',
                   '--pi',str(Path(os.environ['GITHUB_WORKSPACE'])/'scripts/run-pi-in-docker.py'),
                   '--claim-root',str(retained/'local-claims'),'--reasoning-effort',os.environ['CONSTRUCTION_REASONING_EFFORT'],
                   '--github-claim-repository',os.environ['GITHUB_REPOSITORY'],'--github-claim-revision',os.environ['GITHUB_SHA']]
          for key,value in inputs.items():command+=['--'+key.replace('_','-'),value]
          subprocess.run(command,check=True)
          PY
      - name: Execute one durable baseline-feedback continuation
        if: steps.input_mode.outputs.baseline_continuation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-runtime.json
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-docker-config
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'recipe-author';retained=root/'retained-baseline'
          inputs=json.loads((retained/'bridge-inputs.json').read_bytes())
          command=['python3','scripts/run-baseline-continuation.py','--prepared-output',
                   '--output',str(root),'--request',str(root/'request.json'),
                   '--gate','target/release/agentlab-maintainer-skill-flywheel',
                   '--pi',str(Path(os.environ['GITHUB_WORKSPACE'])/'scripts/run-pi-in-docker.py'),
                   '--claim-root',str(retained/'local-claims'),'--reasoning-effort',os.environ['CONSTRUCTION_REASONING_EFFORT'],
                   '--repository',os.environ['GITHUB_REPOSITORY'],'--method-revision',os.environ['GITHUB_SHA'],
                   '--source-git-checkout',str(Path(os.environ['RUNNER_TEMP'])/'recipe-source')]
          for key,value in inputs.items():command+=['--'+key.replace('_','-'),value]
          subprocess.run(command,check=True)
          PY
      - name: Independently validate recorded participant isolation
        id: author_isolation
        if: always() && steps.contain.outcome == 'success'
        run: |
          cmp "$RUNNER_TEMP/recipe-runtime.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/config.json"
          labels=()
          for label in source-recipe-design source-recipe-design-revision-1 source-recipe-design-revision-2 source-recipe-author; do
            if test -f "$RUNNER_TEMP/recipe-author/runtime-receipts/$label.json"; then
              labels+=(--label "$label")
            fi
          done
          python3 scripts/validate-participant-runtime.py --config "$RUNNER_TEMP/recipe-author/runtime-inputs/config.json" \
            --receipt-root "$RUNNER_TEMP/recipe-author/runtime-receipts" \
            --workspace "$RUNNER_TEMP/recipe-author/agent/workspace" \
            --participant-state "$RUNNER_TEMP/recipe-author/agent/participant-state" \
            "${labels[@]}" --output "$RUNNER_TEMP/recipe-author/runtime-validation.json"
      - name: Diagnose unchanged generated verifier baseline in a separate container
        id: baseline_diagnostic
        if: inputs.design_first || steps.input_mode.outputs.reviewed_successor == 'true' || steps.input_mode.outputs.baseline_continuation == 'true'
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-runtime.json
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-docker-config
        run: |
          compiler="$RUNNER_TEMP/recipe-compiler/node_modules/typescript/lib/typescript.js"
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/run-source-recipe-diagnostic-loop.py \
            --root "$RUNNER_TEMP/recipe-author" --gate target/release/agentlab-maintainer-skill-flywheel \
            --compiler "$compiler" --image-id "$image_id" --maximum-repairs "$CONSTRUCTION_CODE_REVISIONS"
      - name: Diagnose complete frozen control suite and fresh accepted-reference recovery
        id: control_suite
        if: inputs.design_first || steps.input_mode.outputs.reviewed_successor == 'true' || steps.input_mode.outputs.baseline_continuation == 'true'
        run: |
          compiler="$RUNNER_TEMP/recipe-compiler/node_modules/typescript/lib/typescript.js"
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/run-source-recipe-control-suite.py \
            --root "$RUNNER_TEMP/recipe-author" --gate target/release/agentlab-maintainer-skill-flywheel \
            --compiler "$compiler" --image-id "$image_id"
      - name: Prepare independent reviewer on the same original suite
        id: review_contain
        # A complete disagreement remains a failed task but is useful review input.
        # Native preparation reconstructs the full export; partial/infrastructure
        # failures cannot launch a reviewer merely because some files exist.
        if: ${{ !cancelled() && inputs.independent_review && steps.author_isolation.outcome == 'success' && steps.baseline_diagnostic.outcome == 'success' }}
        run: |
          root="$RUNNER_TEMP/recipe-author/automatic-review"
          mkdir "$root/source"
          cp -R "$RUNNER_TEMP/recipe-author/observation-export" "$root/source/observations"
          target/release/agentlab-maintainer-skill-flywheel --prepare-source-suite-review \
            --source "$root/source/observations" --quality-rubric "$root/rubric.json" \
            --source-git-checkout "$RUNNER_TEMP/recipe-source" --output "$root/preflight.json"
          mkdir "$RUNNER_TEMP/recipe-review-case" "$RUNNER_TEMP/recipe-review-docker-config"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          (root/'recipe-review-case/manifest.json').write_text(json.dumps(dict(schema='agentlab.blind_case_participant_bundle.v1',reviewOnly=True,automaticPromotion=False)))
          (root/'recipe-review-docker-config/config.json').write_text('{"auths":{}}')
          PY
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/prepare-participant-runtime.py --image "$image_id" --pi-runtime "$RUNNER_TEMP/recipe-pi" \
            --case-input "$RUNNER_TEMP/recipe-review-case" --forbid "$GITHUB_WORKSPACE" \
            --forbid "$RUNNER_TEMP/recipe-source" --forbid "$RUNNER_TEMP/recipe-author" \
            --output "$RUNNER_TEMP/recipe-review-runtime.json"
          mkdir "$root/runtime-inputs"
          cp "$RUNNER_TEMP/recipe-review-runtime.json" "$root/runtime-inputs/config.json"
          cp "$RUNNER_TEMP/recipe-review-case/manifest.json" "$root/runtime-inputs/manifest.json"
          cp "$RUNNER_TEMP/recipe-pi/package-lock.json" "$root/runtime-inputs/package-lock.json"
      - name: Automatically capture a fresh independent reviewer
        id: review_capture
        if: ${{ !cancelled() && inputs.independent_review && steps.review_contain.outcome == 'success' }}
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-review-runtime.json
          AGENTLAB_PARTICIPANT_RUNTIME_RECEIPT_ROOT: ${{ runner.temp }}/recipe-author/automatic-review/runtime-receipts
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-review-docker-config
        run: |
          root="$RUNNER_TEMP/recipe-author/automatic-review"
          python3 scripts/run-source-suite-review.py --source "$root/source/observations" \
            --rubric "$root/rubric.json" --output "$root/agent" \
            --source-git-checkout "$RUNNER_TEMP/recipe-source" \
            --gate target/release/agentlab-maintainer-skill-flywheel --pi "$GITHUB_WORKSPACE/scripts/run-pi-in-docker.py" \
            --reasoning-effort "$CONSTRUCTION_REASONING_EFFORT" --thinking-type "$CONSTRUCTION_THINKING_TYPE" \
            --gateway-timeout-seconds 240 --max-output-tokens "$CONSTRUCTION_MAX_OUTPUT_TOKENS" \
            --review-repair-limit "$AUTOMATIC_REVIEW_REPAIR_LIMIT"
      - name: Independently validate automatic reviewer isolation
        id: review_isolation
        if: always() && steps.review_contain.outcome == 'success'
        run: |
          root="$RUNNER_TEMP/recipe-author/automatic-review"
          cmp "$RUNNER_TEMP/recipe-review-runtime.json" "$root/runtime-inputs/config.json"
          receipts="$root/runtime-receipts"
          if [[ "$AUTOMATIC_REVIEW_REPAIR_LIMIT" == 1 ]]; then receipts="$receipts/initial"; fi
          python3 scripts/validate-participant-runtime.py --config "$root/runtime-inputs/config.json" \
            --receipt-root "$receipts" --workspace "$root/agent/workspace" \
            --participant-state "$root/agent/participant-state" --label source-suite-review \
            --output "$root/runtime-validation.json"
          if [[ -d "$root/agent/repair-attempt" ]]; then
            python3 scripts/validate-participant-runtime.py --config "$root/runtime-inputs/config.json" \
              --receipt-root "$root/runtime-receipts/repair-1" --workspace "$root/agent/repair-attempt/workspace" \
              --participant-state "$root/agent/repair-attempt/participant-state" --label source-suite-review \
              --output "$root/runtime-repair-validation.json"
          fi
      - name: Automatically export and independently receive accepted feedback
        if: ${{ !cancelled() && inputs.independent_review && steps.review_capture.outcome == 'success' && steps.review_isolation.outcome == 'success' }}
        run: |
          root="$RUNNER_TEMP/recipe-author/automatic-review"
          selected=$(jq -er 'select(.completed == true) | .selectedAttempt' "$root/agent/attempt-coordinator.json")
          case "$selected" in
            .) agent="$root/agent" ;;
            repair-attempt) agent="$root/agent/repair-attempt" ;;
            *) echo "Unexpected selected review attempt" >&2; exit 1 ;;
          esac
          verdict=$(jq -er '.verdict' "$agent/validation.json")
          case "$verdict" in
            reject|unverified) echo "Completed feedback has no accepted lesson; nothing exported."; exit 0 ;;
            accept) ;;
            *) echo "Unexpected native review verdict" >&2; exit 1 ;;
          esac
          target/release/agentlab-maintainer-skill-flywheel --export-source-suite-review-feedback \
            --source "$root/source/observations" --quality-rubric "$root/rubric.json" \
            --participant-evidence "$agent/evidence" --review-response "$agent/response.json" \
            --source-git-checkout "$RUNNER_TEMP/recipe-source" --output "$root/feedback"
          target/release/agentlab-maintainer-skill-flywheel --verify-source-suite-review-feedback \
            --source "$root/source/observations" --quality-rubric "$root/rubric.json" \
            --participant-evidence "$agent/evidence" --review-response "$agent/response.json" \
            --source-git-checkout "$RUNNER_TEMP/recipe-source" --feedback "$root/feedback" \
            --output "$root/native-reception.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unreviewed-source-recipe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recipe-author
            !${{ runner.temp }}/recipe-author/automatic-review
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.independent_review
        with:
          name: independent-source-suite-review-${{ github.run_id }}
          path: ${{ runner.temp }}/recipe-author/automatic-review
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

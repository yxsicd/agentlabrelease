name: Maintainer source recipe construction
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository selector; source-only gap selected by strict Rust planner
        default: code-workshop
        required: true
        type: string
      model:
        default: glm-5.3-flash
        required: true
        type: string
      guidance_selection:
        description: Optional checked-in exact-cut calibration selection with sourceRecipeTarget; no external URL
        default: ''
        required: false
        type: string
      guidance_mode:
        description: Same reviewed construction target and budgets; only guided receives the selected knowledge body
        default: guided
        required: true
        type: choice
        options: [guided, unguided]
      provider_route:
        default: glm
        required: true
        type: string
      reasoning_effort:
        description: Provider-supported reasoning setting; default omits the field, none is an explicit value
        default: low
        required: true
        type: choice
        options: [default, none, low, medium, high, max]
      gateway_timeout_seconds:
        description: Absolute upstream wall-time limit; independent of output token ceiling
        default: '180'
        required: true
        type: choice
        options: ['60', '120', '180']
      code_gateway_timeout_seconds:
        description: Code-only observation cohort; inherit preserves existing deadlines, 240 needs measured late content evidence
        default: inherit
        required: true
        type: choice
        options: [inherit, '180', '240']
      max_output_tokens:
        description: Constructor output token ceiling; includes provider reasoning tokens where applicable
        default: '16384'
        required: true
        type: choice
        options: ['8192', '16384']
      thinking_type:
        description: Provider-supported thinking.type; default omits the independent field
        default: default
        required: true
        type: choice
        options: [default, enabled, disabled]
      response_format:
        description: Provider-supported output mode; default omits the field
        default: default
        required: true
        type: choice
        options: [default, json-object]
      api:
        description: Exact provider wire protocol; catalog identity does not imply protocol compatibility
        default: openai-completions
        required: true
        type: choice
        options: [openai-completions, openai-responses]
      revision_parent_run:
        description: Optional completed constructor Action run for one independently reviewed revision
        default: ''
        required: false
        type: string
      revision_feedback:
        description: Exact review JSON; design_review.v2 protects checks/scenarios (legacy v1 is prose-only), or proposal review v3; never approval
        default: ''
        required: false
        type: string
      design_first:
        description: Validate scenario expectations and exact source transformations before code generation
        default: true
        required: true
        type: boolean
      design_revisions:
        description: Maximum same-session design corrections; source/knowledge or transport failures never retry
        default: '1'
        required: true
        type: choice
        options: ['0', '1', '2']
      code_revisions:
        description: Fresh-root only; automatic frozen-design verifier repairs after contained baseline diagnostics
        default: '0'
        required: true
        type: choice
        options: ['0', '1', '2']
permissions:
  contents: read
  actions: read
concurrency:
  group: maintainer-source-recipe-author
  cancel-in-progress: false
jobs:
  construct:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.code_gateway_timeout_seconds == '240' && 25 || 20 }}
    env:
      KNOWLEDGE: examples/maintainer-knowledge-gate/first-four
      AGENTLAB_SOURCE_GUIDANCE_SELECTION: ${{ inputs.guidance_selection }}
      AGENTLAB_SOURCE_GUIDANCE_MODE: ${{ inputs.guidance_mode }}
      REPOSITORY_SELECTOR: ${{ inputs.repository }}
      AGENTLAB_MODEL: ${{ inputs.model }}
      AGENTLAB_PROVIDER_ROUTE: ${{ inputs.provider_route }}
      CONSTRUCTION_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      CONSTRUCTION_GATEWAY_TIMEOUT: ${{ inputs.gateway_timeout_seconds }}
      CONSTRUCTION_CODE_GATEWAY_TIMEOUT: ${{ inputs.code_gateway_timeout_seconds }}
      CONSTRUCTION_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
      CONSTRUCTION_THINKING_TYPE: ${{ inputs.thinking_type }}
      CONSTRUCTION_RESPONSE_FORMAT: ${{ inputs.response_format }}
      CONSTRUCTION_API: ${{ inputs.api }}
      REVISION_PARENT_RUN: ${{ inputs.revision_parent_run }}
      REVISION_FEEDBACK: ${{ inputs.revision_feedback }}
      CONSTRUCTION_DESIGN_FIRST: ${{ inputs.design_first }}
      CONSTRUCTION_DESIGN_REVISIONS: ${{ inputs.design_revisions }}
      CONSTRUCTION_CODE_REVISIONS: ${{ inputs.code_revisions }}
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
      AGENTLAB_TABLEGIT_MCP_URL: ${{ vars.AGENTLAB_TABLEGIT_MCP_URL }}
      AGENTLAB_TABLEGIT_PERSON_ID: ${{ vars.AGENTLAB_TABLEGIT_PERSON_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate explicit revision input pairing
        run: |
          python3 - <<'PY'
          import json,os
          run=os.environ['REVISION_PARENT_RUN'];feedback=os.environ['REVISION_FEEDBACK']
          assert bool(run)==bool(feedback),'Revision parent and review must be supplied together'
          repairs=int(os.environ['CONSTRUCTION_CODE_REVISIONS'])
          selection=os.environ['AGENTLAB_SOURCE_GUIDANCE_SELECTION']
          if selection:
              from pathlib import Path
              assert not selection.startswith('/') and chr(92) not in selection
              assert all(p not in ('','.','..') for p in selection.split('/'))
              path=Path(selection)
              assert path.is_file() and not path.is_symlink()
              root=Path.cwd().resolve();assert path.resolve().is_relative_to(root)
              assert len(path.read_bytes())<=2*1024*1024
          assert 0<=repairs<=2
          assert not repairs or (not run and os.environ['CONSTRUCTION_DESIGN_FIRST']=='true'),'Automatic code repair requires a fresh design-first root; old review budgets remain exhausted'
          if run:
              assert run.isascii() and run.isdigit() and 0<len(run)<=20 and int(run)>0
              assert len(feedback.encode())<=16384
              assert isinstance(json.loads(feedback),dict)
              if json.loads(feedback).get('schema') in ('agentlab.source_recipe_design_review.v1','agentlab.source_recipe_design_review.v2'):
                  assert os.environ['CONSTRUCTION_DESIGN_FIRST']=='true','Design review requires design-first'
          PY
      - name: Bind optional guidance to the checked-in knowledge directory
        run: |
          if test -n "$AGENTLAB_SOURCE_GUIDANCE_SELECTION"; then
            echo "AGENTLAB_SOURCE_GUIDANCE_KNOWLEDGE=$GITHUB_WORKSPACE/$KNOWLEDGE" >> "$GITHUB_ENV"
          fi
      - name: Exact live knowledge admission before model budget
        run: |
          mkdir -p "$RUNNER_TEMP/recipe-author"
          preflight_status=0
          python3 scripts/maintainer-skill-tablegit.py preflight --base "$KNOWLEDGE" \
            --receipt "$RUNNER_TEMP/recipe-author/authority-preflight.json" \
            > "$RUNNER_TEMP/recipe-author/authority-preflight-stdout.log" \
            2> "$RUNNER_TEMP/recipe-author/authority-preflight-stderr.log" || preflight_status=$?
          cat "$RUNNER_TEMP/recipe-author/authority-preflight-stdout.log"
          cat "$RUNNER_TEMP/recipe-author/authority-preflight-stderr.log" >&2
          exit "$preflight_status"
      - name: Build native producer and isolated runtime
        run: |
          cargo build --locked --release -p agentlab_code_analysis --bin agentlab-maintainer-skill-flywheel
          mkdir -p "$RUNNER_TEMP/recipe-pi" "$RUNNER_TEMP/recipe-compiler"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/recipe-pi/"
          cp examples/knowledge-seed/subject/runtime/package*.json "$RUNNER_TEMP/recipe-compiler/"
          npm ci --prefix "$RUNNER_TEMP/recipe-pi" --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/recipe-compiler" --no-audit --no-fund
          docker pull node:24.19.0-bookworm-slim
      - name: Select operation gap and prepare bounded original-source request
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);knowledge=Path(os.environ['KNOWLEDGE']).resolve()
          output=root/'recipe-author';source=root/'recipe-source'
          gate=Path('target/release/agentlab-maintainer-skill-flywheel').resolve()
          def run(*args): subprocess.run([str(gate),*map(str,args)],check=True)
          run('--resolve-latest-assessment','--base',knowledge,'--output',output/'durable.json')
          baseline=json.loads(Path(json.loads((output/'durable.json').read_bytes())['assessmentPath']).read_bytes())
          args=['--plan-next-round','--scope-skills',knowledge/'maintainer_scope_skills.jsonl','--program-facts',knowledge/'program_facts.jsonl',
                '--operation-receipts-root',knowledge/'operation-evidence','--round-index',baseline['roundIndex'],
                '--available-lane','operation-verification','--available-operation-kind','source-only','--repository',os.environ['REPOSITORY_SELECTOR'],
                '--batch-size',1,'--output',output/'plan.json']
          if baseline.get('parentAssessmentSha256'):args+=['--parent-assessment-sha256',baseline['parentAssessmentSha256']]
          run(*args)
          plan=json.loads((output/'plan.json').read_bytes());assert len(plan['selectedScopeIds'])==1
          scope=next(json.loads(l) for l in (knowledge/'maintainer_scope_skills.jsonl').read_text().splitlines() if json.loads(l)['id']==plan['selectedScopeIds'][0])
          (output/'checkout-request.json').write_text(json.dumps({'scope':scope})+'\n')
          subprocess.run(['bash','scripts/checkout-maintainer-scope.sh',scope['repository'],scope['sourceRevision'],scope['pathBoundary'],str(source),str(output/'checkout-request.json')],check=True)
          node=Path(subprocess.check_output(['which','node'],text=True).strip()).resolve()
          compiler=root/'recipe-compiler/node_modules/typescript/lib/typescript.js'
          policy={'schema':'agentlab.source_recipe_author_policy.v1','program':str(node),'programSha256':hashlib.sha256(node.read_bytes()).hexdigest(),
                  'methodDependencies':[{'path':str(compiler),'sha256':hashlib.sha256(compiler.read_bytes()).hexdigest()}],'automaticPromotion':False}
          (output/'policy.json').write_text(json.dumps(policy)+'\n')
          run('--prepare-source-recipe-author','--knowledge',knowledge,'--source-worktree',source,'--repository',os.environ['REPOSITORY_SELECTOR'],
              '--author-policy',output/'policy.json','--output',output/'request.json')
          PY
      - name: Bind one reviewed revision to original constructor evidence
        if: inputs.revision_parent_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);output=root/'recipe-author'
          run=os.environ['REVISION_PARENT_RUN'];repo=os.environ['GITHUB_REPOSITORY']
          info=json.loads(subprocess.check_output(['gh','run','view',run,'--repo',repo,'--json','workflowName,event,status']))
          assert info['workflowName']=='Maintainer source recipe construction' and info['event']=='workflow_dispatch' and info['status']=='completed'
          parent=root/'recipe-parent'
          subprocess.run(['gh','run','download',run,'--repo',repo,'--name','unreviewed-source-recipe-'+run,'--dir',str(parent)],check=True)
          assert not (parent/'agent/revision-request.json').exists(),'Only one revision from an original construction is supported'
          review=output/'review-feedback.json'
          with review.open('x') as f:f.write(os.environ['REVISION_FEEDBACK'])
          if json.loads(review.read_bytes()).get('schema') in ('agentlab.source_recipe_design_review.v1','agentlab.source_recipe_design_review.v2'):
              subprocess.run(['python3','scripts/prepare-source-design-review.py',
                  '--gate','target/release/agentlab-maintainer-skill-flywheel',
                  '--request',str(output/'request.json'),'--parent',str(parent),
                  '--feedback',str(review),'--output',str(output)],check=True)
              raise SystemExit(0)
          args=['target/release/agentlab-maintainer-skill-flywheel','--prepare-source-recipe-revision',
              '--author-request',str(output/'request.json'),'--parent-author-request',str(parent/'request.json'),
              '--proposal',str(parent/'agent/proposal.json'),'--review-feedback',str(review),
              '--output',str(output/'revision-request.json')]
          parent_design=parent/'agent/design.json'
          if parent_design.exists():args+=['--parent-design',str(parent_design)]
          subprocess.run(args,check=True)
          PY
      - name: Contain construction Agent without source or host evaluator mounts
        id: contain
        run: |
          mkdir "$RUNNER_TEMP/recipe-case" "$RUNNER_TEMP/recipe-docker-config"
          printf '{"schema":"agentlab.blind_case_participant_bundle.v1","sourceOnly":true,"automaticPromotion":false}\n' > "$RUNNER_TEMP/recipe-case/manifest.json"
          printf '{"auths":{}}\n' > "$RUNNER_TEMP/recipe-docker-config/config.json"
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/prepare-participant-runtime.py --image "$image_id" --pi-runtime "$RUNNER_TEMP/recipe-pi" \
            --case-input "$RUNNER_TEMP/recipe-case" --forbid "$GITHUB_WORKSPACE" --forbid "$RUNNER_TEMP/recipe-source" \
            --forbid "$RUNNER_TEMP/recipe-author" --output "$RUNNER_TEMP/recipe-runtime.json"
          mkdir "$RUNNER_TEMP/recipe-author/runtime-inputs"
          cp "$RUNNER_TEMP/recipe-runtime.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/config.json"
          cp "$RUNNER_TEMP/recipe-case/manifest.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/manifest.json"
          cp "$RUNNER_TEMP/recipe-pi/package-lock.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/package-lock.json"
      - name: Freeze code repair budget before the first model turn
        if: inputs.design_first && inputs.revision_parent_run == ''
        run: |
          target/release/agentlab-maintainer-skill-flywheel --prepare-source-recipe-loop-intent \
            --author-request "$RUNNER_TEMP/recipe-author/request.json" --maximum-repairs "$CONSTRUCTION_CODE_REVISIONS" \
            --output "$RUNNER_TEMP/recipe-author/diagnostic-loop-intent.json"
      - name: Produce captured unreviewed recipe only
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-runtime.json
          AGENTLAB_PARTICIPANT_RUNTIME_RECEIPT_ROOT: ${{ runner.temp }}/recipe-author/runtime-receipts
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-docker-config
        run: |
          revision_args=()
          if test -f "$RUNNER_TEMP/recipe-author/revision-request.json"; then
            revision_args=(--revision-request "$RUNNER_TEMP/recipe-author/revision-request.json")
          fi
          if test -f "$RUNNER_TEMP/recipe-author/review-parent-design.json"; then
            revision_args+=(--parent-design "$RUNNER_TEMP/recipe-author/review-parent-design.json" \
              --design-review-feedback "$RUNNER_TEMP/recipe-author/review-feedback.json")
          fi
          if test "$CONSTRUCTION_DESIGN_FIRST" = true; then
            revision_args+=(--design-first)
          fi
          if test -f "$RUNNER_TEMP/recipe-author/diagnostic-loop-intent.json"; then
            revision_args+=(--diagnostic-loop-intent "$RUNNER_TEMP/recipe-author/diagnostic-loop-intent.json")
          fi
          if test "$CONSTRUCTION_CODE_GATEWAY_TIMEOUT" != inherit; then
            revision_args+=(--code-gateway-timeout-seconds "$CONSTRUCTION_CODE_GATEWAY_TIMEOUT")
          fi
          python3 scripts/run-source-recipe-author.py --request "$RUNNER_TEMP/recipe-author/request.json" \
            --output "$RUNNER_TEMP/recipe-author/agent" --gate target/release/agentlab-maintainer-skill-flywheel \
            --pi "$GITHUB_WORKSPACE/scripts/run-pi-in-docker.py" \
            --reasoning-effort "$CONSTRUCTION_REASONING_EFFORT" \
            --gateway-timeout-seconds "$CONSTRUCTION_GATEWAY_TIMEOUT" \
            --max-output-tokens "$CONSTRUCTION_MAX_OUTPUT_TOKENS" \
            --thinking-type "$CONSTRUCTION_THINKING_TYPE" \
            --response-format "$CONSTRUCTION_RESPONSE_FORMAT" \
            --api "$CONSTRUCTION_API" --design-revisions "$CONSTRUCTION_DESIGN_REVISIONS" "${revision_args[@]}"
      - name: Independently validate recorded participant isolation
        if: always() && steps.contain.outcome == 'success'
        run: |
          cmp "$RUNNER_TEMP/recipe-runtime.json" "$RUNNER_TEMP/recipe-author/runtime-inputs/config.json"
          labels=()
          for label in source-recipe-design source-recipe-design-revision-1 source-recipe-design-revision-2 source-recipe-author; do
            if test -f "$RUNNER_TEMP/recipe-author/runtime-receipts/$label.json"; then
              labels+=(--label "$label")
            fi
          done
          python3 scripts/validate-participant-runtime.py --config "$RUNNER_TEMP/recipe-author/runtime-inputs/config.json" \
            --receipt-root "$RUNNER_TEMP/recipe-author/runtime-receipts" \
            --workspace "$RUNNER_TEMP/recipe-author/agent/workspace" \
            --participant-state "$RUNNER_TEMP/recipe-author/agent/participant-state" \
            "${labels[@]}" --output "$RUNNER_TEMP/recipe-author/runtime-validation.json"
      - name: Diagnose unchanged generated verifier baseline in a separate container
        if: inputs.design_first
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PARTICIPANT_RUNTIME_CONFIG: ${{ runner.temp }}/recipe-runtime.json
          DOCKER_CONFIG: ${{ runner.temp }}/recipe-docker-config
        run: |
          compiler="$RUNNER_TEMP/recipe-compiler/node_modules/typescript/lib/typescript.js"
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/run-source-recipe-diagnostic-loop.py \
            --root "$RUNNER_TEMP/recipe-author" --gate target/release/agentlab-maintainer-skill-flywheel \
            --compiler "$compiler" --image-id "$image_id" --maximum-repairs "$CONSTRUCTION_CODE_REVISIONS"
      - name: Diagnose complete frozen control suite and fresh accepted-reference recovery
        if: inputs.design_first
        run: |
          compiler="$RUNNER_TEMP/recipe-compiler/node_modules/typescript/lib/typescript.js"
          image_id=$(docker image inspect node:24.19.0-bookworm-slim --format '{{.Id}}')
          python3 scripts/run-source-recipe-control-suite.py \
            --root "$RUNNER_TEMP/recipe-author" --gate target/release/agentlab-maintainer-skill-flywheel \
            --compiler "$compiler" --image-id "$image_id"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unreviewed-source-recipe-${{ github.run_id }}
          path: ${{ runner.temp }}/recipe-author
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

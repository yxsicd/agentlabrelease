name: Real Code Agent acceptance
on:
  workflow_dispatch:
    inputs:
      agent:
        description: Replaceable participant implementation
        type: choice
        options: [pi, mini-swe-agent]
        default: pi
      scenario:
        description: Harmony demand sequence
        type: choice
        options: [hello, counter, form]
        default: hello
      model:
        description: Model exposed by the LM Gateway
        required: true
        default: glm-5.3-flash
        type: string
      provider_route:
        description: Explicit LM Gateway provider route
        required: true
        default: glm
        type: string
      plan_run_id:
        description: Frozen channel-plan run to consume (optional for standalone acceptance)
        required: false
        default: ""
        type: string
      capture_run_id:
        description: Reuse complete or partial capture from a previous trusted main run without redispatching Pi
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      agent:
        type: string
        default: pi
      plan_run_id:
        type: string
        required: true
      model:
        type: string
        default: glm-5.3-flash
      provider_route:
        type: string
        default: glm
    secrets:
      AGENTLAB_LM_GATEWAY_KEY:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: real-code-agent-acceptance
  cancel-in-progress: false
jobs:
  pi-harmony:
    # External credentials are never exposed to PR or arbitrary branch code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENTLAB_CI_ROOT: /tmp/agentlab-real-acceptance
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
      AGENTLAB_SCENARIO: ${{ inputs.scenario || 'hello' }}
      AGENTLAB_AGENT: ${{ inputs.agent || 'pi' }}
      AGENTLAB_MODEL: ${{ inputs.model }}
      AGENTLAB_PROVIDER_ROUTE: ${{ inputs.provider_route }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Load one frozen composition
        id: composition
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/real-composition"
          if [[ -n "$PLAN_RUN_ID" ]]; then
            gh run download "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name channel-validation-plan --dir "$RUNNER_TEMP/real-composition"
          else
            cp release/candidates/40ecdf4b-linux-x64/{publication,environment-lock}.json "$RUNNER_TEMP/real-composition/"
          fi
          for file in standalone-harmony.json standalone-sessionfs.json mcpgit-program.json; do
            cp "release/ci/$file" "$RUNNER_TEMP/real-composition/$file"
          done
          python3 scripts/channel-input.py --source "$RUNNER_TEMP/real-composition" --output "$GITHUB_OUTPUT"
      - name: Install archive support
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd python3-websocket
      - name: Restore a previous capture with original producer identity
        if: inputs.capture_run_id != ''
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID" > "$RUNNER_TEMP/prior-run.json"
          gh run download "$CAPTURE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name real-pi-harmony-acceptance --dir "$RUNNER_TEMP/prior-capture"
          python3 - <<'PYCODE'
          import json, os, pathlib, shutil
          prior = json.load(open(os.environ["RUNNER_TEMP"] + "/prior-run.json"))
          assert prior["head_branch"] == "main" and prior["name"] == "Real Code Agent acceptance"
          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "prior-capture/real-agent/evidence"
          target = pathlib.Path(os.environ["AGENTLAB_CI_ROOT"]) / "real-agent/evidence"
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, target)
          receipt = dict(schema="agentlab.ci-capture-replay.v1", originalRunId=prior["id"],
                         originalProducerRevision=prior["head_sha"], replayRunId=os.environ["GITHUB_RUN_ID"],
                         subjectRedispatched=False, originalCaptureModified=False)
          (target.parents[1] / "capture-replay.json").write_text(json.dumps(receipt, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("producer_revision=" + prior["head_sha"] + "\n")
          PYCODE
      - name: Install the separately contained Pi runtime
        if: inputs.capture_run_id == '' && inputs.agent != 'mini-swe-agent'
        run: |
          mkdir -p "$RUNNER_TEMP/pi-runtime"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/pi-runtime/"
          npm ci --prefix "$RUNNER_TEMP/pi-runtime"
          "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi" --version
      - name: Install disposable mini-SWE-agent runtime outside Workspace
        if: inputs.capture_run_id == '' && inputs.agent == 'mini-swe-agent'
        run: |
          python3 -m venv "$RUNNER_TEMP/mini-runtime"
          "$RUNNER_TEMP/mini-runtime/bin/pip" install -r examples/real-code-agent/participant/mini-requirements.lock
      - name: Acquire and install published AgentLab components
        id: install
        env:
          AGENTLAB_RELEASE_CHANNEL: ${{ steps.composition.outputs.channel }}
          AGENTLAB_COMPOSITION_DIR: ${{ runner.temp }}/real-composition
          GITHUB_TOKEN: ${{ github.token }}
          AGENTLAB_STANDALONE_HARMONY_LOCK: ${{ runner.temp }}/real-composition/standalone-harmony.json
          AGENTLAB_STANDALONE_SESSIONFS_LOCK: ${{ runner.temp }}/real-composition/standalone-sessionfs.json
        run: scripts/ci-public-install-deploy-smoke.sh
      - id: subject
        name: Run real Pi with the public LM Gateway and independently compile every edit
        if: inputs.capture_run_id == ''
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
        run: |
          if [[ "$AGENTLAB_AGENT" == 'mini-swe-agent' ]]; then
            AGENT_BIN="$RUNNER_TEMP/mini-runtime/bin/python"
          else
            AGENT_BIN="$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi"
          fi
          python3 examples/harmony-build/run.py \
            --install-root "$AGENTLAB_CI_ROOT" \
            --root "$AGENTLAB_CI_ROOT/real-agent" \
            --agent-bin "$AGENT_BIN" --agent-implementation "$AGENTLAB_AGENT" \
            --gateway-url "$AGENTLAB_LM_GATEWAY_URL" --model "$AGENTLAB_MODEL" \
            --provider-route "$AGENTLAB_PROVIDER_ROUTE" --scenario "$AGENTLAB_SCENARIO"
      - id: persistence
        name: Persist actual capture to TableGit and recover after storage restart
        if: always() && steps.install.outcome == 'success'
        env:
          AGENTLAB_CHANNEL_PLAN_FILE: ${{ steps.composition.outputs.plan_file }}
          AGENTLAB_MCPGIT_PROGRAM_LOCK: ${{ runner.temp }}/real-composition/mcpgit-program.json
          AGENTLAB_CAPTURE_PRODUCER_REVISION: ${{ steps.replay.outputs.producer_revision }}
          AGENTLAB_CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          mapfile -t runtime < <(python3 - <<'PYCODE'
          import json
          import os
          lock = json.load(open(os.environ["RUNNER_TEMP"] + "/real-composition/environment-lock.json"))
          print(lock["images"][0]["reference"])
          print(next(c["volume"] for c in lock["components"] if c["slot"] == "release"))
          PYCODE
          )
          /usr/bin/python3 examples/tablegit-session/run.py \
            --image "${runtime[0]}" --runtime-volume "${runtime[1]}" \
            --sdk-program "$RUNNER_TEMP/real-composition/session-sdk.json" \
            --root "$AGENTLAB_CI_ROOT/real-tablegit" \
            --capture-evidence "$AGENTLAB_CI_ROOT/real-agent/evidence"
      - name: Record the actual frozen-plan real-Agent check
        if: always() && inputs.plan_run_id != ''
        env:
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence.outcome }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          python3 scripts/channel-real-receipt.py --source "$RUNNER_TEMP/real-composition" --root "$AGENTLAB_CI_ROOT"
      - name: Explain actual acceptance results
        if: always()
        run: python3 scripts/demo-summary.py "$AGENTLAB_CI_ROOT" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete controlled test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-pi-harmony-acceptance
          if-no-files-found: error
          path: |
            ${{ env.AGENTLAB_CI_ROOT }}/real-agent/evidence/
            ${{ env.AGENTLAB_CI_ROOT }}/runs/
            ${{ env.AGENTLAB_CI_ROOT }}/real-tablegit/evidence-*/
            ${{ env.AGENTLAB_CI_ROOT }}/*.json
            ${{ env.AGENTLAB_CI_ROOT }}/*.log

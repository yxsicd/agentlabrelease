name: Multi-repository candidate cohort review
on:
  workflow_dispatch:
    inputs:
      proposal_run_id:
        description: Successful trusted-main candidate-cohort proposal run
        required: true
        type: string
      expected_proposal_sha256:
        description: Exact proposal digest inspected by the reviewer
        required: true
        type: string
      selected_candidate_ids:
        description: Comma-separated eligible candidate IDs selected before construction
        required: true
        type: string
      acknowledged_risk_ids:
        description: Comma-separated cohort risk IDs, exactly as reviewed
        required: true
        type: string
      rationale:
        description: Why this exact non-representative cohort is suitable for independent case construction
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTLAB_ROOT: ${{ github.workspace }}/.agentlab-work/multi-repo-candidate-cohort-review
      SOURCE_RUN_ID: ${{ inputs.proposal_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify and recover exact cohort proposal evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$AGENTLAB_ROOT"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$AGENTLAB_ROOT/source-run.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ["AGENTLAB_ROOT"] + "/source-run.json"))
          assert value["head_branch"] == "main"
          assert value["path"] in {
              ".github/workflows/multi-repo-candidate-cohort.yml",
              ".github/workflows/mixed-case-candidate-cohort.yml",
          }
          assert value["event"] == "workflow_dispatch"
          assert value["conclusion"] == "success"
          PY
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name multi-repo-candidate-cohort-proposal --dir "$AGENTLAB_ROOT/source"
          SOURCE_WORKFLOW="$(python3 -c 'import json,os; print(json.load(open(os.environ["AGENTLAB_ROOT"] + "/source-run.json"))["path"])')"
          if [[ "$SOURCE_WORKFLOW" == ".github/workflows/multi-repo-candidate-cohort.yml" ]]; then
            python3 scripts/multi-repo-analysis-run.py validate \
              --root "$AGENTLAB_ROOT/source/analysis-source" \
              --run "$AGENTLAB_ROOT/source/analysis-source/analysis-run.json"
          else
            python3 scripts/candidate-source-bundle.py validate \
              --root "$AGENTLAB_ROOT/source" \
              --bundle "$AGENTLAB_ROOT/source/candidate-source-bundle.json"
          fi
          python3 - <<'PY'
          import json, os
          root = os.environ["AGENTLAB_ROOT"]
          proposal = json.load(open(root + "/source/candidate-cohort-proposal.json"))
          source_run = json.load(open(root + "/source-run.json"))
          assert proposal["proposalMethodRevision"] == source_run["head_sha"]
          if source_run["path"] == ".github/workflows/multi-repo-candidate-cohort.yml":
              source = json.load(open(root + "/source/analysis-source/analysis-run.json"))
              expected_digest = source["difficultyEvidenceSha256"]
          else:
              source = json.load(open(root + "/source/candidate-source-bundle.json"))
              expected_digest = source["mergedCandidateSourceSha256"]
              assert source["methodRevision"] == source_run["head_sha"]
          assert proposal["methodRevision"] == source["methodRevision"]
          assert proposal["sourceSetSha256"] == source["sourceSetSha256"]
          assert proposal["difficultyEvidenceSha256"] == expected_digest
          PY
      - name: Bind explicit reviewer selection to the exact proposal
        env:
          EXPECTED_PROPOSAL_SHA256: ${{ inputs.expected_proposal_sha256 }}
          SELECTED_CANDIDATE_IDS: ${{ inputs.selected_candidate_ids }}
          ACKNOWLEDGED_RISK_IDS: ${{ inputs.acknowledged_risk_ids }}
          REVIEW_RATIONALE: ${{ inputs.rationale }}
          REVIEWER: ${{ github.actor }}
        run: |
          python3 scripts/review-multi-repo-candidate-cohort.py decide \
            --proposal "$AGENTLAB_ROOT/source/candidate-cohort-proposal.json" \
            --expected-sha256 "$EXPECTED_PROPOSAL_SHA256" \
            --selected-candidate-ids "$SELECTED_CANDIDATE_IDS" \
            --reviewer "$REVIEWER" \
            --acknowledged-risk-ids "$ACKNOWLEDGED_RISK_IDS" \
            --rationale "$REVIEW_RATIONALE" \
            --output "$AGENTLAB_ROOT/candidate-cohort-review.json"
          python3 scripts/review-multi-repo-candidate-cohort.py compile \
            --proposal "$AGENTLAB_ROOT/source/candidate-cohort-proposal.json" \
            --review "$AGENTLAB_ROOT/candidate-cohort-review.json" \
            --output "$AGENTLAB_ROOT/candidate-cohort.json"
          sha256sum "$AGENTLAB_ROOT/candidate-cohort.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve reviewed cohort and its complete source frame
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-repo-candidate-cohort-review
          if-no-files-found: error
          path: ${{ env.AGENTLAB_ROOT }}/

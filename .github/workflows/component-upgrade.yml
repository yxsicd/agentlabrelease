name: Compose single-component upgrade
on:
  workflow_dispatch:
    inputs:
      base_release:
        description: Published base channel or immutable qualified cut
        default: aldev
        required: true
      base_publication_url:
        description: Optional explicit base publication URL for nonstandard asset names
        default: ""
      base_lock_url:
        description: Optional explicit base lock URL if the publication does not declare it
        default: ""
      donor_release:
        description: Optional published candidate or qualified cut containing the replacement
        default: ""
      replacement_url:
        description: Explicit component_update.v1 descriptor URL; use instead of donor_release
        default: ""
      component:
        description: 'session-sdk, control, pack:release, pack:tools, pack:harmony-cli, pack:harmony-build-kit, image:runtime'
        required: true
permissions:
  contents: write
jobs:
  compose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Acquire explicit published compositions
        env:
          BASE: ${{ inputs.base_release }}
          DONOR: ${{ inputs.donor_release }}
          BASE_PUBLICATION_URL: ${{ inputs.base_publication_url }}
          BASE_LOCK_URL: ${{ inputs.base_lock_url }}
          REPLACEMENT_URL: ${{ inputs.replacement_url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          replacement=os.environ['REPLACEMENT_URL']
          assert bool(replacement) != bool(os.environ['DONOR']), 'select replacement_url or donor_release'
          if replacement:
              (pathlib.Path(os.environ['RUNNER_TEMP'])/'replacement.json').write_bytes(urllib.request.urlopen(replacement,timeout=30).read())
          for role,tag in [('base',os.environ['BASE'])]+([] if replacement else [('donor',os.environ['DONOR'])]):
              assert pathlib.Path(tag).name == tag
              root=pathlib.Path(os.environ['RUNNER_TEMP'])/role
              root.mkdir()
              base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+tag+'/'
              name='agentlab-'+tag+'-publication.json' if tag in ['aldev','almain','alprod'] else 'publication.json'
              publication_url=os.environ['BASE_PUBLICATION_URL'] if role=='base' and os.environ['BASE_PUBLICATION_URL'] else base+name
              raw=urllib.request.urlopen(publication_url,timeout=30).read()
              (root/'publication.json').write_bytes(raw)
              pub=json.loads(raw)
              explicit=os.environ['BASE_LOCK_URL'] if role=='base' else ''
              url=explicit or urllib.parse.urljoin(publication_url,pub.get('environmentLockUrl','./environment-lock.json'))
              (root/'environment-lock.json').write_bytes(urllib.request.urlopen(url,timeout=30).read())
          PY
      - name: Compose and validate only the selected replacement
        env:
          COMPONENT: ${{ inputs.component }}
          REPLACEMENT_URL: ${{ inputs.replacement_url }}
        run: |
          if [ -n "$REPLACEMENT_URL" ]; then
            SOURCE=(--replacement "$RUNNER_TEMP/replacement.json")
          else
            SOURCE=(--donor "$RUNNER_TEMP/donor")
          fi
          python3 scripts/component-upgrade.py --base "$RUNNER_TEMP/base" "${SOURCE[@]}" \
            --component "$COMPONENT" --tag "candidate-component-$GITHUB_RUN_ID" --output "$RUNNER_TEMP/candidate"
          python3 - <<'PY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('validate','scripts/validate-composition-release.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          pub=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate/publication.json').read_text())
          m.remote_assets(pub['assets'])
          PY
      - name: Publish reference-only candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "candidate-component-$GITHUB_RUN_ID" "$RUNNER_TEMP/candidate/"*.json \
            --prerelease --title "Single-component candidate $GITHUB_RUN_ID" \
            --notes "Reference-only composition; unqualified until channel-plan.yml passes. No component payload rebuilt or copied."
      - name: Preserve source and upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-upgrade-evidence
          path: |
            ${{ runner.temp }}/base/
            ${{ runner.temp }}/donor/
            ${{ runner.temp }}/replacement.json
            ${{ runner.temp }}/candidate/

name: Multi-repository model construction
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model exposed by the LM Gateway
        required: true
        default: glm-5.3-flash
        type: string
      provider_route:
        description: Explicit LM Gateway provider route
        required: true
        default: glm
        type: string
      cohort_review_run_id:
        description: Successful trusted-main reviewed candidate-cohort run
        required: true
        type: string
      expected_cohort_sha256:
        description: Exact reviewed cohort digest used for this construction
        required: true
        type: string
      candidate_id:
        description: One exact member of the predeclared reviewed cohort
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: multi-repo-model-construction
  cancel-in-progress: false

jobs:
  construct:
    # The workflow is intentionally manual and credential-bearing code only runs
    # from the trusted default branch. Pull requests exercise the mock path.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTLAB_ROOT: ${{ github.workspace }}/.agentlab-work/multi-repo-model-construction
      AGENTLAB_LM_GATEWAY_URL: ${{ vars.AGENTLAB_LM_GATEWAY_URL || 'https://llm-m4dd.de.yxsbase.win' }}
      AGENTLAB_MODEL: ${{ inputs.model }}
      AGENTLAB_PROVIDER_ROUTE: ${{ inputs.provider_route }}
      SOURCE_RUN_ID: ${{ inputs.cohort_review_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Recover the exact reviewed candidate cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$AGENTLAB_ROOT/cohort"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$AGENTLAB_ROOT/cohort-run.json"
          python3 - <<'PY'
          import json, os
          value = json.load(open(os.environ["AGENTLAB_ROOT"] + "/cohort-run.json"))
          assert value["head_branch"] == "main"
          assert value["path"] == ".github/workflows/multi-repo-candidate-cohort-review.yml"
          assert value["event"] == "workflow_dispatch"
          assert value["conclusion"] == "success"
          PY
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name multi-repo-candidate-cohort-review --dir "$AGENTLAB_ROOT/cohort"
      - name: Build the revision-fenced analysis binary
        run: cargo build --locked -p agentlab_code_analysis --bin agentlab-multi-repo-analysis
      - name: Reproduce exact source evidence and resolve one reviewed member
        id: analysis
        env:
          EXPECTED_COHORT_SHA256: ${{ inputs.expected_cohort_sha256 }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          python3 scripts/prepare-multi-repo-construction-fixture.py \
            --source examples/multi-repo-case/baseline \
            --output "$AGENTLAB_ROOT/input"
          target/debug/agentlab-multi-repo-analysis \
            "$AGENTLAB_ROOT/input/manifest.json" "$AGENTLAB_ROOT/analysis"
          python3 scripts/select-multi-repo-cohort-candidate.py \
            --cohort "$AGENTLAB_ROOT/cohort/candidate-cohort.json" \
            --difficulty "$AGENTLAB_ROOT/analysis/difficulty_candidates.json" \
            --expected-cohort-sha256 "$EXPECTED_COHORT_SHA256" \
            --candidate-id "$CANDIDATE_ID" \
            --output "$AGENTLAB_ROOT/candidate-selection.json"
          echo "candidate_id=$CANDIDATE_ID" >> "$GITHUB_OUTPUT"
      - name: Install a separately contained Pi runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pi-runtime"
          cp examples/real-code-agent/participant/package*.json "$RUNNER_TEMP/pi-runtime/"
          npm ci --prefix "$RUNNER_TEMP/pi-runtime"
          "$RUNNER_TEMP/pi-runtime/node_modules/.bin/pi" --version
      - name: Ask Pi to construct an intent from exact source and fact evidence
        env:
          AGENTLAB_LM_GATEWAY_KEY: ${{ secrets.AGENTLAB_LM_GATEWAY_KEY }}
          AGENTLAB_PI_BINARY: ${{ runner.temp }}/pi-runtime/node_modules/.bin/pi
        run: |
          python3 scripts/run-multi-repo-intent-construction.py \
            --manifest "$AGENTLAB_ROOT/input/manifest.json" \
            --difficulty "$AGENTLAB_ROOT/analysis/difficulty_candidates.json" \
            --facts "$AGENTLAB_ROOT/analysis/workspace_facts.jsonl" \
            --candidate-id '${{ steps.analysis.outputs.candidate_id }}' \
            --oracle-contract examples/multi-repo-case/oracle-contract.json \
            --participant examples/multi-repo-case/pi-construction-agent.py \
            --participant-id "pi-${AGENTLAB_MODEL}" \
            --output "$AGENTLAB_ROOT/construction"
      - name: Apply the deterministic pre-review quality gate
        run: |
          python3 scripts/score-multi-repo-intent.py \
            --intent "$AGENTLAB_ROOT/construction/intent.json" \
            --construction-receipt "$AGENTLAB_ROOT/construction/construction-receipt.json" \
            --oracle-contract examples/multi-repo-case/oracle-contract.json \
            --output "$AGENTLAB_ROOT/construction/intent-quality.json"
          cat "$AGENTLAB_ROOT/construction/intent-quality.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the exact review-required proposal
        run: |
          python3 scripts/propose-multi-repo-case-plan.py \
            --difficulty "$AGENTLAB_ROOT/analysis/difficulty_candidates.json" \
            --intent "$AGENTLAB_ROOT/construction/intent.json" \
            --construction-receipt "$AGENTLAB_ROOT/construction/construction-receipt.json" \
            --quality-report "$AGENTLAB_ROOT/construction/intent-quality.json" \
            --output "$AGENTLAB_ROOT/case-plan-proposal.json"
          sha256sum "$AGENTLAB_ROOT/case-plan-proposal.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Propose hidden dependency obligations from exact recursive evidence
        run: |
          python3 scripts/propose-dependency-discovery-plan.py \
            --case-plan-proposal "$AGENTLAB_ROOT/case-plan-proposal.json" \
            --difficulty "$AGENTLAB_ROOT/analysis/difficulty_candidates.json" \
            --program-facts "$AGENTLAB_ROOT/analysis/workspace_facts.jsonl" \
            --output "$AGENTLAB_ROOT/dependency-discovery-plan-proposal.json"
          sha256sum "$AGENTLAB_ROOT/dependency-discovery-plan-proposal.json" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the operator-owned calibration fixture
        run: |
          mkdir -p "$AGENTLAB_ROOT/operator-fixture"
          cp -R examples/multi-repo-case/reference "$AGENTLAB_ROOT/operator-fixture/reference"
          cp examples/multi-repo-case/calibrate.py \
            examples/multi-repo-case/oracle.mjs \
            "$AGENTLAB_ROOT/operator-fixture/"
          sha256sum "$AGENTLAB_ROOT/operator-fixture/calibrate.py" \
            "$AGENTLAB_ROOT/operator-fixture/oracle.mjs" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source identities, native model capture and gate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-repo-model-construction
          if-no-files-found: error
          path: ${{ env.AGENTLAB_ROOT }}/

[package]
name = "agentlab_code_analysis"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "agentlab-code-analysis"

[[bin]]
name = "agentlab-code-analysis"
path = "src/main.rs"

[[bin]]
name = "agentlab-harmony-materialize"
path = "src/harmony_materialize.rs"

[[bin]]
name = "agentlab-source-probe"
path = "src/source_probe.rs"

[[bin]]
name = "agentlab-multi-repo-analysis"
path = "src/multi_repo.rs"

[[bin]]
name = "agentlab-purchase-data-runtime-plan"
path = "src/purchase_data_runtime_plan.rs"

[[bin]]
name = "agentlab-purchase-data-ohostest-proposal"
path = "src/purchase_data_ohostest_proposal.rs"

[[bin]]
name = "agentlab-purchase-data-ohostest-reference-qualification"
path = "src/purchase_data_ohostest_reference_qualification.rs"

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-language = "=0.1.8"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dev-dependencies]
tree-sitter-arkts = "=0.2.0"

[[bin]]
name = "agentlab-asset-model"
path = "src/asset_model.rs"

[[bin]]
name = "agentlab-experience"
path = "src/experience.rs"

[[bin]]
name = "agentlab-cache-seed"
path = "src/cache_seed.rs"
